syntax = "proto3";

package crosscodex.v1;

import "crosscodex/v1/common.proto";

option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// CatalogService parses multi-format compliance catalogs.
// Supports OSCAL, Gemara, and future formats via unified model.
//
// DESIGN NOTE: Format enum rather than format-specific RPCs because
// analysis/synthesis/graph operate on unified control model.
// If future formats require fundamentally different entity types,
// revisit this decision.
//
// COUPLING: Consumes ingestion.Document, feeds analysis.WorkItem
service CatalogService {
  // Parse catalog from structured JSON
  rpc ParseCatalog(ParseCatalogRequest) returns (ParseCatalogResponse);

  // Get catalog metadata
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);

  // List catalogs
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse);

  // Get individual control
  rpc GetControl(GetControlRequest) returns (GetControlResponse);

  // Search controls by text/metadata
  rpc SearchControls(SearchControlsRequest) returns (SearchControlsResponse);

  // Retire versions of a catalog document: archive each one, then delete it
  // with its controls, containers, classifications, embeddings and cached
  // results in one transaction, re-pointing the version that superseded it to
  // its predecessor. All or nothing: when any named version is protected the
  // request fails with FAILED_PRECONDITION, the message names every blocker,
  // and nothing changes. A version is protected while it is the document's
  // current version, an active legal hold covers it, a job under legal hold
  // uses it, or a job that uses it has attestations. Graph nodes are left in
  // place. FAILED_PRECONDITION also means the server cannot retire (it needs
  // database.purge_dsn and an archive backend); NOT_FOUND means the document
  // or a label does not exist.
  rpc RetireCatalogVersion(RetireCatalogVersionRequest) returns (RetireCatalogVersionResponse);
}

enum CatalogFormat {
  CATALOG_FORMAT_UNSPECIFIED = 0;
  CATALOG_FORMAT_OSCAL = 1;      // NIST OSCAL
  CATALOG_FORMAT_GEMARA = 2;     // OpenSSF Gemara
  // Future: CIS, SCAP, ISO 27001 Annex A
}

message ParseCatalogRequest {
  TenantContext tenant_context = 1;
  string document_id = 2;        // References ingestion.Document
  CatalogFormat format = 3;      // Required - which parser to use
  string catalog_name = 4;       // User-provided name
  map<string, string> parse_options = 5;  // Format-specific hints
  // Optional. Imports the catalog as a version of the named document (for
  // example "nist-800-53"): 1-63 characters of a-z, 0-9 and '-', starting with
  // a letter or digit. The first import of a slug creates the document; a later
  // import of different content becomes its current version and supersedes the
  // previous one. Content already stored under another slug is refused with
  // FAILED_PRECONDITION. Empty imports the catalog outside any document.
  string document_slug = 6;
  // Optional, requires document_slug. Label for this version, 1-64 characters
  // with no control characters, Unicode format characters, line or paragraph
  // separators, '<', '>' or '`'. When empty, the OSCAL metadata.version is used
  // if it is a valid label, else "<UTC date> · <first 6 hex of content hash>".
  string version_label = 7;
  // Optional. The ID of the crosscodex-ingestion mapping the conversion was
  // asked to use; empty for none. For converted output, the output's
  // metadata.source.mapping.id must equal it (an output naming no mapping
  // equals ""), else the import is refused with FAILED_PRECONDITION and
  // nothing is stored. Non-empty with OSCAL content is INVALID_ARGUMENT.
  string ingestion_mapping = 8;
}

message ParseCatalogResponse {
  string catalog_id = 1;
  JobStatus status = 2;
  // Every imported control that is not withdrawn and has neither requirement
  // text nor a usable title, in document order, with no cap. They keep their
  // place in the catalog but are not analysed.
  repeated TextlessControl textless_controls = 3;
  // Set only when document_slug was given: the version rendered for humans as
  // "slug @ label (date · hash6)".
  string version = 4;
  // The catalog this import superseded as its document's current version. Empty
  // for a document's first version and when the same content was re-imported.
  string superseded_catalog_id = 5;
  // Control differences against superseded_catalog_id. Absent when there is no
  // superseded catalog.
  ChangeReport change_report = 6;
  // Set only when document_slug was given: the label stored for the version
  // (the request's version_label, else the OSCAL metadata.version, else
  // "date · hash6"). For content already in the document it is the label
  // stored by the first import.
  string version_label = 7;
  // The SHA-256 (64 lowercase hex characters) of the mapping file the
  // conversion used, as recorded in the converted output. Set exactly when the
  // request's ingestion_mapping was non-empty.
  string ingestion_mapping_sha256 = 8;
  // How crosscodex-ingestion structured the document, as recorded in its
  // converted output (schema 1.4 and later): "mapping" (read from a structured
  // source through a mapping file, so the structure is the publisher's),
  // "heading", "table" or "pattern" (found by ingestion in the document's
  // layout, so the structure is a guess). Empty for OSCAL, Gemara and converted
  // output below schema 1.4. A client that shows an import to a person should
  // say so when the value is "heading", "table" or "pattern". An import of such
  // output is refused (FAILED_PRECONDITION, nothing stored) when a
  // catalog.structuring setting that only tuned the pre-1.4 structuring
  // cascade is not at its default; the error names each such setting.
  string ingestion_structure_method = 9;
}

// ChangeReport lists control identifiers that differ between a version and the
// one it superseded. It is computed from stored controls, never the graph.
message ChangeReport {
  // Identifiers present in the new version only, sorted.
  // protolint:disable:next REPEATED_FIELD_NAMES_PLURALIZED
  repeated string added = 1;
  // Identifiers present in the superseded version only, sorted.
  // protolint:disable:next REPEATED_FIELD_NAMES_PLURALIZED
  repeated string removed = 2;
  // Identifiers in both versions whose statement text differs, sorted.
  // protolint:disable:next REPEATED_FIELD_NAMES_PLURALIZED
  repeated string changed = 3;
  // True when the versions share so few identifiers that the lists should not
  // be read as an edit history (for example the publisher renumbered controls).
  bool ids_unstable = 4;
}

// A control imported without requirement text or a usable title. It is stored
// but not analysed.
message TextlessControl {
  string identifier = 1;           // The control's identifier in the catalog
  // Names of the control's direct child parts that hold prose anywhere in
  // their subtree, sorted and deduplicated. If one of them holds the
  // requirement, add it to catalog.requirement_part_names and re-import.
  repeated string part_names = 2;
}

message Catalog {
  string catalog_id = 1;
  TenantContext tenant_context = 2;
  string name = 3;
  CatalogFormat format = 4;      // Source format
  string version = 5;            // Format version
  AuditMetadata audit = 6;
  ProvenanceMetadata provenance = 7;
  int32 control_count = 8;
  map<string, string> properties = 9;  // Format-specific metadata
  // Slug of the document this catalog is a version of; empty when the catalog
  // was imported outside any document.
  string document_slug = 10;
  // Label of this version within its document; empty outside a document.
  string version_label = 11;
  // The catalog this version superseded; empty for a document's first version
  // and outside a document.
  string supersedes_catalog_id = 12;
  // How the lineage link was established: "declared" (the importer named the
  // document). Empty outside a document.
  string link_method = 13;
  // True when this catalog is the current version of its document. False for
  // superseded versions and for catalogs outside any document.
  bool current = 14;
}

message Control {
  string control_id = 1;           // Qualified: catalog_id/AC-1
  string catalog_id = 2;
  string identifier = 3;           // "AC-1", "SI-2.1", "REQ-SBOM-001"
  string title = 4;
  string statement = 5;            // Full control/requirement prose
  repeated string parameters = 6;  // Parameter IDs
  map<string, string> parts = 7;  // guidance, objectives, etc.
  AuditMetadata audit = 8;
}

message GetCatalogRequest {
  TenantContext tenant_context = 1;
  string catalog_id = 2;
}

message GetCatalogResponse {
  Catalog catalog = 1;
}

message RetireCatalogVersionRequest {
  TenantContext tenant_context = 1;
  // The document whose versions to retire, as given to ParseCatalog's
  // document_slug (for example "nist-800-53").
  string document_slug = 2;
  // One or more version labels of that document (Catalog.version_label), for
  // example "Rev 4". Every label must name exactly one version; a repeated
  // label is retired once. Singular to match Catalog.version_label, whose
  // values it carries.
  // protolint:disable:next REPEATED_FIELD_NAMES_PLURALIZED
  repeated string version_label = 3;
}

message RetireCatalogVersionResponse {
  // The catalog IDs that were archived and deleted, in request order.
  repeated string retired_catalog_ids = 1;
}

message ListCatalogsRequest {
  TenantContext tenant_context = 1;
  ListOptions options = 2;
}

message ListCatalogsResponse {
  repeated Catalog catalogs = 1;
  PageInfo page_info = 2;
}

message GetControlRequest {
  TenantContext tenant_context = 1;
  string control_id = 2;
}

message GetControlResponse {
  Control control = 1;
}

message SearchControlsRequest {
  TenantContext tenant_context = 1;
  string query = 2;  // Full-text search
  repeated string catalog_ids = 3;  // Optional filter
  CatalogFormat format = 4;  // Optional filter
  ListOptions options = 5;
}

message SearchControlsResponse {
  repeated Control controls = 1;
  PageInfo page_info = 2;
}

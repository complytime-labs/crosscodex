syntax = "proto3";

package crosscodex.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

import "crosscodex/v1/common.proto";

option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// AdminService provides system administration.
//
// SECURITY: Admin-only endpoints, enforced by gateway RBAC
service AdminService {
  // Tenant management
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

  // Health checks
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  // Get service status
  rpc GetServiceStatus(GetServiceStatusRequest)
      returns (GetServiceStatusResponse);

  // PKI management (for mTLS)
  // Issue certificate
  rpc IssueCertificate(IssueCertificateRequest)
      returns (IssueCertificateResponse);
  // Revoke certificate
  rpc RevokeCertificate(RevokeCertificateRequest)
      returns (RevokeCertificateResponse);
  // List certificates
  rpc ListCertificates(ListCertificatesRequest)
      returns (ListCertificatesResponse);

  // Data retention
  // Apply retention policy
  rpc ApplyRetentionPolicy(ApplyRetentionPolicyRequest)
      returns (ApplyRetentionPolicyResponse);
  // Get retention stats
  rpc GetRetentionStats(GetRetentionStatsRequest)
      returns (GetRetentionStatsResponse);
  // Scan and enforce retention lifecycle
  rpc ScanRetention(ScanRetentionRequest) returns (ScanRetentionResponse);
  // Create a legal hold preventing data deletion
  rpc CreateHold(CreateHoldRequest) returns (CreateHoldResponse);
  // Release a legal hold by name
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse);
  // List active legal holds
  rpc ListHolds(ListHoldsRequest) returns (ListHoldsResponse);
}

message CreateTenantRequest {
  string tenant_id = 1;
  string display_name = 2;
  TenantConfig config = 3;
}

message TenantConfig {
  int64 max_catalogs = 1;
  int64 max_storage_bytes = 2;
  bool enable_feedback = 3;
  map<string, string> settings = 4;
}

message CreateTenantResponse {
  Tenant tenant = 1;
}

message Tenant {
  string tenant_id = 1;
  string display_name = 2;
  TenantConfig config = 3;
  AuditMetadata audit = 4;
  bool is_active = 5;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

message ListTenantsRequest {
  ListOptions options = 1;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  PageInfo page_info = 2;
}

message UpdateTenantRequest {
  string tenant_id = 1;
  TenantConfig config = 2;
}

message UpdateTenantResponse {
  Tenant tenant = 1;
}

message DeleteTenantRequest {
  string tenant_id = 1;
  bool purge_data = 2;
}

message DeleteTenantResponse {
  bool deleted = 1;
}

message HealthCheckRequest {
  string service = 1;  // Optional: specific service
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

message HealthCheckResponse {
  HealthStatus status = 1;
  map<string, ServiceHealth> services = 2;
}

message ServiceHealth {
  string service_name = 1;
  HealthStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp last_check = 4;
}

message GetServiceStatusRequest {
}


message GetServiceStatusResponse {
  repeated ServiceInfo services = 1;
}

message ServiceInfo {
  string service_name = 1;
  string version = 2;
  google.protobuf.Timestamp started_at = 3;
  int64 requests_handled = 4;
  map<string, string> metadata = 5;
}

message IssueCertificateRequest {
  string subject = 1;
  string tenant_id = 2;
  int32 validity_days = 3;
  repeated string dns_names = 4;
}

message IssueCertificateResponse {
  string certificate_pem = 1;
  // Private key is ONLY returned on initial certificate issuance.
  // Never stored server-side. Never returned by ListCertificates or other RPCs.
  // Client MUST persist this value securely - cannot be retrieved later.
  string private_key_pem = 2;
  string serial_number = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message RevokeCertificateRequest {
  string serial_number = 1;
  string revocation_reason = 2;
}

message RevokeCertificateResponse {
  bool revoked = 1;
}

message ListCertificatesRequest {
  string tenant_id = 1;  // Optional filter
  ListOptions options = 2;
}

message ListCertificatesResponse {
  repeated CertificateInfo certificates = 1;
  PageInfo page_info = 2;
}

message CertificateInfo {
  string serial_number = 1;
  string subject = 2;
  string tenant_id = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool is_revoked = 6;
}

message ApplyRetentionPolicyRequest {
  TenantContext tenant_context = 1;
  RetentionPolicy policy = 2;
  bool dry_run = 3;
}

message RetentionPolicy {
  string attestation     = 1;
  string job_results     = 2;
  string catalogs        = 3;
  string embeddings      = 4;
  string audit_decisions = 5;
  string audit_llm       = 6;
  string audit_events    = 7;
}

message ApplyRetentionPolicyResponse {
  // Result of applying the supplied policy immediately (respecting dry_run).
  RetentionReport report = 1;
}

message GetRetentionStatsRequest {
  TenantContext tenant_context = 1;
}

// StreamDrift reports whether one audit JetStream's live retention (max age)
// matches the retention the configuration intends for it. This is an infra
// config-vs-live check, orthogonal to a data-retention scan.
message StreamDrift {
  // Stream name (e.g. "AUDIT_LLM").
  string stream = 1;
  // Retention the configuration intends for this stream.
  google.protobuf.Duration configured = 2;
  // Retention currently live on the server (zero when the stream is absent).
  google.protobuf.Duration live = 3;
  // True only when the stream exists live and its retention matches configured.
  bool ok = 4;
}

message GetRetentionStatsResponse {
  // Per-class counts a dry-run scan would find right now: scanned = expired
  // and eligible, held = blocked by an active legal hold. archived/purged
  // are always 0 for a dry run.
  RetentionReport eligible = 1;
  // Number of legal holds currently active for the tenant.
  int64 active_holds = 2;
  // Per-stream audit-retention drift (configured vs live max age).
  repeated StreamDrift stream_drifts = 3;
}

// ClassCount aggregates retention action tallies for a single data class.
message ClassCount {
  int64 scanned  = 1;
  int64 held     = 2;
  int64 archived = 3;
  int64 purged   = 4;
}

// RetentionReport summarises the outcome of a retention scan.
message RetentionReport {
  int64 scanned                     = 1;
  int64 held                        = 2;
  int64 archived                    = 3;
  int64 purged                      = 4;
  map<string, ClassCount> per_class = 5;
  repeated string errors            = 6;
}

// HoldScope selects which records a legal hold covers.
message HoldScope {
  optional google.protobuf.Timestamp created_before = 1;
  string tenant_id                                  = 2;
  string job_id                                     = 3;
}

// Hold represents a legal hold that prevents data deletion.
message Hold {
  string id                                      = 1;
  string name                                    = 2;
  HoldScope scope                                = 3;
  google.protobuf.Timestamp created_at           = 4;
  string created_by                              = 5;
  optional google.protobuf.Timestamp expires_at  = 6;
  optional google.protobuf.Timestamp released_at = 7;
  string released_by                             = 8;
}

message ScanRetentionRequest {
  TenantContext tenant_context = 1;
  bool dry_run                 = 2;
}

message ScanRetentionResponse {
  RetentionReport report = 1;
}

message CreateHoldRequest {
  TenantContext tenant_context                   = 1;
  string name                                    = 2;
  HoldScope scope                                = 3;
  optional google.protobuf.Timestamp expires_at  = 4;
}

message CreateHoldResponse {
  Hold hold = 1;
}

message ReleaseHoldRequest {
  TenantContext tenant_context = 1;
  string name                  = 2;
}

message ReleaseHoldResponse {
}

message ListHoldsRequest {
  TenantContext tenant_context = 1;
}

message ListHoldsResponse {
  repeated Hold holds = 1;
}

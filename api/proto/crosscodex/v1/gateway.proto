syntax = "proto3";

package crosscodex.v1;

import "crosscodex/v1/admin.proto";
import "crosscodex/v1/catalog.proto";
import "crosscodex/v1/common.proto";
import "crosscodex/v1/feedback.proto";
import "crosscodex/v1/graph.proto";
import "crosscodex/v1/pipeline.proto";
import "crosscodex/v1/synthesis.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// GatewayService is the public REST API.
//
// SECURITY: Extracts TenantContext from mTLS/SAML/Kerberos
// TRACEABILITY: Each RPC documents internal service call chains
service GatewayService {
  // Import a document as a catalog. Starts no analysis: call StartAnalysis
  // with the returned catalog_id.
  // INTERNAL: ingestion.ConvertDocument → catalog.ParseCatalog
  rpc SubmitDocument(SubmitDocumentRequest) returns (SubmitDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/documents"
      body: "*"
    };
  }

  // Get job status
  // INTERNAL: pipeline.GetJob
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{job_id}"
    };
  }

  // List jobs
  // INTERNAL: pipeline.ListJobs
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (google.api.http) = {
      get: "/v1/jobs"
    };
  }

  // Cancel job
  // INTERNAL: pipeline.CancelJob
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/cancel"
      body: "*"
    };
  }

  // Retry a job. With retry_from_failure, resumes a failed or cancelled job
  // in place from its first failed or cancelled stage, keeping the stages
  // that completed; refused (FailedPrecondition) when the job's failure is
  // one a retry cannot fix. Without it, starts a new job with the same
  // config.
  // INTERNAL: pipeline.RetryJob
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/retry"
      body: "*"
    };
  }

  // Start analysis of an imported catalog
  // INTERNAL: catalog.GetCatalog → pipeline.CreateJob(FULL_ANALYSIS)
  rpc StartAnalysis(StartAnalysisRequest) returns (StartAnalysisResponse) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "*"
    };
  }

  // List catalogs
  // INTERNAL: catalog.ListCatalogs
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs"
    };
  }

  // Get catalog
  // INTERNAL: catalog.GetCatalog
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs/{catalog_id}"
    };
  }

  // Search controls
  // INTERNAL: catalog.SearchControls
  rpc SearchControls(SearchControlsRequest) returns (SearchControlsResponse) {
    option (google.api.http) = {
      get: "/v1/controls"
    };
  }

  // Get control details
  // INTERNAL: catalog.GetControl
  rpc GetControl(GetControlRequest) returns (GetControlResponse) {
    option (google.api.http) = {
      get: "/v1/controls/{control_id}"
    };
  }

  // Get control mappings
  // INTERNAL: MappingsBackend.ListMappings (synthesized, all jobs)
  rpc GetControlMappings(GetControlMappingsRequest)
      returns (GetControlMappingsResponse) {
    option (google.api.http) = {
      get: "/v1/controls/{control_id}/mappings"
    };
  }

  // List a job's mappings by stage, confidence, relationship type and control
  // INTERNAL: MappingsBackend.ListMappings
  rpc ListJobMappings(ListJobMappingsRequest) returns (ListJobMappingsResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{job_id}/mappings"
    };
  }

  // Query graph
  // INTERNAL: graph.Query (restricted Cypher subset for safety)
  rpc QueryGraph(QueryGraphRequest) returns (QueryGraphResponse) {
    option (google.api.http) = {
      post: "/v1/graph/query"
      body: "*"
    };
  }

  // Similarity search
  // INTERNAL: graph.SimilaritySearch
  rpc FindSimilar(FindSimilarRequest) returns (FindSimilarResponse) {
    option (google.api.http) = {
      post: "/v1/controls/{control_id}/similar"
      body: "*"
    };
  }

  // Submit vote on mapping
  // INTERNAL: feedback.SubmitVote
  rpc SubmitVote(SubmitVoteRequest) returns (SubmitVoteResponse) {
    option (google.api.http) = {
      post: "/v1/mappings/{mapping_id}/vote"
      body: "*"
    };
  }

  // Get review queue
  // INTERNAL: feedback.GetReviewQueue
  rpc GetReviewQueue(GetReviewQueueRequest) returns (GetReviewQueueResponse) {
    option (google.api.http) = {
      get: "/v1/review/queue"
    };
  }

  // Health check (public, no auth required)
  // INTERNAL: admin.HealthCheck
  rpc Health(HealthRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/health"
    };
  }

  // Stream a large document for import using chunked upload.
  // First message must contain StreamDocumentMetadata; subsequent messages
  // carry raw bytes. Server reassembles and delegates to SubmitDocument logic.
  // Starts no analysis: call StartAnalysis with the returned catalog_id.
  // INTERNAL: ingestion.ConvertDocument → catalog.ParseCatalog
  rpc StreamDocument(stream StreamDocumentChunk) returns (SubmitDocumentResponse) {}
}

// Gateway-specific request types

message HealthRequest {
  string service = 1;  // Optional: specific service
}

message SubmitDocumentRequest {
  // TenantContext extracted from auth, not in request body
  oneof source {
    bytes content = 1;
    string source_uri = 2;
  }
  ContentMetadata metadata = 3;
  CatalogFormat catalog_format = 4;
  string catalog_name = 5;

  reserved 6, 7;
  reserved "target_catalog_id", "synthesis_config";
}

// Response of both upload RPCs (SubmitDocument, StreamDocument).
message SubmitDocumentResponse {
  string document_id = 2;
  string catalog_id = 4;

  reserved 1, 3;
  reserved "job_id", "status";
}

message StartAnalysisRequest {
  TenantContext tenant_context = 1;
  // ID of the catalog whose controls are mapped: the source of every pair.
  // A catalog the tenant imported (SubmitDocument/StreamDocument returns
  // it; ListCatalogs lists them). Required.
  string source_catalog_id = 2;
  SynthesisConfig synthesis_config = 3;
  // ID of the catalog the source controls are mapped onto: the target of
  // every pair. Required: StartAnalysis rejects an empty value with
  // InvalidArgument. Set it to source_catalog_id to analyse within one
  // catalog, which pairs that catalog's controls with each other in both
  // directions. The job classifies and embeds the controls of both
  // catalogs.
  string target_catalog_id = 4;
  // Also pair target controls with source controls (target to source), in
  // addition to the default source to target. Doubles the pair analyzers'
  // LLM calls. Rejected with InvalidArgument when target_catalog_id equals
  // source_catalog_id: within one catalog, controls are already paired in
  // both directions.
  bool bidirectional = 5;
}

message StartAnalysisResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message GetControlMappingsRequest {
  // TenantContext from auth
  string control_id = 1;
  float min_confidence = 2;
  // Max mappings returned (0 = 50, max 1000); no further pages — use ListJobMappings to page
  int32 limit = 3;
}

message GetControlMappingsResponse {
  repeated ControlMapping mappings = 1;
  PageInfo page_info = 2;
}

message QueryGraphRequest {
  // TenantContext from auth
  string cypher = 1;  // Restricted subset validated at gateway
  map<string, string> parameters = 2;
  reserved 3;
}

message QueryGraphResponse {
  QueryResponse response = 1;
}

message FindSimilarRequest {
  // TenantContext from auth
  string control_id = 1;
  int32 limit = 2;
  repeated string catalog_ids = 3;
}

message FindSimilarResponse {
  SimilaritySearchResponse response = 1;
}

message StreamDocumentChunk {
  oneof payload {
    StreamDocumentMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message StreamDocumentMetadata {
  CatalogFormat catalog_format = 1;
  string catalog_name = 2;
  ContentMetadata content_metadata = 5;

  reserved 3, 4;
  reserved "target_catalog_id", "synthesis_config";
}

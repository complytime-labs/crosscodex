syntax = "proto3";

package crosscodex.v1;

import "crosscodex/v1/admin.proto";
import "crosscodex/v1/catalog.proto";
import "crosscodex/v1/common.proto";
import "crosscodex/v1/feedback.proto";
import "crosscodex/v1/graph.proto";
import "crosscodex/v1/pipeline.proto";
import "crosscodex/v1/synthesis.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// GatewayService is the public REST API.
//
// SECURITY: Extracts TenantContext from mTLS/SAML/Kerberos
// TRACEABILITY: Each RPC documents internal service call chains
service GatewayService {
  // Import a document as a catalog. Starts no analysis: call StartAnalysis
  // with the returned catalog_id.
  // INTERNAL: ingestion.ConvertDocument → catalog.ParseCatalog
  rpc SubmitDocument(SubmitDocumentRequest) returns (SubmitDocumentResponse) {
    option (google.api.http) = {
      post: "/v1/documents"
      body: "*"
    };
  }

  // Get job status
  // INTERNAL: pipeline.GetJob
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{job_id}"
    };
  }

  // List jobs
  // INTERNAL: pipeline.ListJobs
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (google.api.http) = {
      get: "/v1/jobs"
    };
  }

  // Cancel job
  // INTERNAL: pipeline.CancelJob
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/cancel"
      body: "*"
    };
  }

  // Retry a job. With retry_from_failure, resumes a failed or cancelled job
  // in place from its first failed or cancelled stage, keeping the stages
  // that completed; refused (FailedPrecondition) when the job's failure is
  // one a retry cannot fix. Without it, starts a new job with the same
  // config.
  // INTERNAL: pipeline.RetryJob
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse) {
    option (google.api.http) = {
      post: "/v1/jobs/{job_id}/retry"
      body: "*"
    };
  }

  // Start analysis of an imported catalog
  // INTERNAL: catalog.GetCatalog → pipeline.CreateJob(FULL_ANALYSIS)
  rpc StartAnalysis(StartAnalysisRequest) returns (StartAnalysisResponse) {
    option (google.api.http) = {
      post: "/v1/jobs"
      body: "*"
    };
  }

  // List catalogs
  // INTERNAL: catalog.ListCatalogs
  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs"
    };
  }

  // Get catalog
  // INTERNAL: catalog.GetCatalog
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs/{catalog_id}"
    };
  }

  // Search controls
  // INTERNAL: catalog.SearchControls
  rpc SearchControls(SearchControlsRequest) returns (SearchControlsResponse) {
    option (google.api.http) = {
      get: "/v1/controls"
    };
  }

  // Get control details
  // INTERNAL: catalog.GetControl
  rpc GetControl(GetControlRequest) returns (GetControlResponse) {
    option (google.api.http) = {
      get: "/v1/controls/{control_id}"
    };
  }

  // Get control mappings
  // INTERNAL: MappingsBackend.ListMappings (synthesized, all jobs)
  rpc GetControlMappings(GetControlMappingsRequest)
      returns (GetControlMappingsResponse) {
    option (google.api.http) = {
      get: "/v1/controls/{control_id}/mappings"
    };
  }

  // List a job's mappings by stage, confidence, relationship type and control
  // INTERNAL: MappingsBackend.ListMappings
  rpc ListJobMappings(ListJobMappingsRequest) returns (ListJobMappingsResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{job_id}/mappings"
    };
  }

  // List a job's relationship candidates: the pairs candidate generation
  // proposed to the relationship analyzer, before any model judged them.
  // INTERNAL: CandidatesBackend.ListCandidates
  rpc ListJobCandidates(ListJobCandidatesRequest) returns (ListJobCandidatesResponse) {
    option (google.api.http) = {
      get: "/v1/jobs/{job_id}/candidates"
    };
  }

  // Export a crosswalk: the related control pairs between catalogs, merged
  // across the tenant's completed jobs. The gateway selects the completed
  // jobs for the mode and passes them to the backend; edges of running,
  // failed or cancelled jobs never appear. Unknown and other-tenant catalogs
  // or jobs answer the same NotFound.
  // INTERNAL: CrosswalkBackend.GetCrosswalk
  rpc GetCrosswalk(GetCrosswalkRequest) returns (GetCrosswalkResponse) {
    option (google.api.http) = {
      get: "/v1/crosswalk"
    };
  }

  // Query graph
  // INTERNAL: graph.Query (restricted Cypher subset for safety)
  rpc QueryGraph(QueryGraphRequest) returns (QueryGraphResponse) {
    option (google.api.http) = {
      post: "/v1/graph/query"
      body: "*"
    };
  }

  // Similarity search
  // INTERNAL: graph.SimilaritySearch
  rpc FindSimilar(FindSimilarRequest) returns (FindSimilarResponse) {
    option (google.api.http) = {
      post: "/v1/controls/{control_id}/similar"
      body: "*"
    };
  }

  // Submit vote on mapping
  // INTERNAL: feedback.SubmitVote
  rpc SubmitVote(SubmitVoteRequest) returns (SubmitVoteResponse) {
    option (google.api.http) = {
      post: "/v1/mappings/{mapping_id}/vote"
      body: "*"
    };
  }

  // Get review queue
  // INTERNAL: feedback.GetReviewQueue
  rpc GetReviewQueue(GetReviewQueueRequest) returns (GetReviewQueueResponse) {
    option (google.api.http) = {
      get: "/v1/review/queue"
    };
  }

  // Health check (public, no auth required)
  // INTERNAL: admin.HealthCheck
  rpc Health(HealthRequest) returns (HealthCheckResponse) {
    option (google.api.http) = {
      get: "/health"
    };
  }

  // Stream a large document for import using chunked upload.
  // First message must contain StreamDocumentMetadata; subsequent messages
  // carry raw bytes. Server reassembles and delegates to SubmitDocument logic.
  // Starts no analysis: call StartAnalysis with the returned catalog_id.
  // INTERNAL: ingestion.ConvertDocument → catalog.ParseCatalog
  rpc StreamDocument(stream StreamDocumentChunk) returns (SubmitDocumentResponse) {}
}

// Gateway-specific request types

// CrosswalkStage selects which stored verdicts a crosswalk lists.
enum CrosswalkStage {
  // Same as CROSSWALK_STAGE_SYNTHESIZED.
  CROSSWALK_STAGE_UNSPECIFIED = 0;
  // The synthesized mappings: the relationship analyzer's verdicts after
  // synthesis consensus (the default).
  CROSSWALK_STAGE_SYNTHESIZED = 1;
  // The relationship analyzer's own verdicts, before synthesis.
  CROSSWALK_STAGE_ANALYZER = 2;
}

// CrosswalkPair names the two catalogs of pair mode.
message CrosswalkPair {
  // Catalog IDs. They must differ: a catalog's internal mappings are
  // exported with GetCrosswalkRequest.job_id. Either direction of any
  // completed job between the two catalogs contributes.
  string catalog_a = 1;
  string catalog_b = 2;
}

// CrosswalkTransitive names the catalogs of transitive mode. All three must
// differ.
message CrosswalkTransitive {
  // The catalog the derived rows start from.
  string catalog_a = 1;
  // The catalog the derived rows end at.
  string catalog_c = 2;
  // The catalog whose controls link A to C: A to hub and hub to C verdicts
  // compose into derived A to C rows. Direct A to C rows are included too.
  string hub_catalog_id = 3;
}

// CrosswalkJob is one completed job that contributes to a crosswalk.
message CrosswalkJob {
  string job_id = 1;
  // The job's catalog_id and target_catalog_id (equal for a job within one
  // catalog; a job stored before cross-catalog analysis has no target and
  // reads as within its source).
  string source_catalog_id = 2;
  string target_catalog_id = 3;
  // True when the job also paired target controls with source controls.
  bool bidirectional = 4;
  // The latest stage completion time; unset when no stage recorded one.
  google.protobuf.Timestamp completed_at = 5;
}

// CrosswalkSide is one end of a crosswalk row, readable without decoding IDs.
message CrosswalkSide {
  // The control's graph node ID.
  string node_id = 1;
  string catalog_id = 2;
  // The catalog's name: as recorded when the contributing job was created
  // when CrosswalkProvenance.catalogs marks it a snapshot, else its current
  // name.
  string framework = 3;
  // The item's identifier in the catalog (its OSCAL id): stable and unique,
  // but not necessarily what the source document prints; see label.
  string identifier = 4;
  // The identifier of the control's parent in the catalog's control tree. A
  // top-level control in a group gets its container's identifier (empty when
  // the group has none); empty for an ungrouped top-level control.
  string parent_identifier = 5;
  // The control's own title; empty when the control has none, never an
  // ancestor's.
  string title = 6;
  string statement = 7;
  // The control's titled ancestors, root first, each as "<title>
  // (<identifier>)", or "<title>" when the ancestor has no identifier (for
  // example an ID-less group), joined by " > ". Untitled ancestors are omitted;
  // empty when no ancestor has a title.
  string context = 8;
  // The item's published label, verbatim from the catalog (for example
  // "AC-2(7)", or "d." for a statement part); empty when the catalog gives
  // none.
  string label = 9;
  // The parent's published label, same rules as label; empty when the item
  // has no parent or the parent has no label.
  string parent_label = 10;
}

// CrosswalkRow is one related control pair.
message CrosswalkRow {
  CrosswalkSide source = 1;
  CrosswalkSide target = 2;
  // The merged verdict, read from source to target.
  RelationshipType relationship_type = 3;
  // The exact word for the verdict, for example "subset of"; a derived row
  // whose composition has no named type reads
  // "related (derived, type unknown)" with relationship_type unspecified.
  string relationship = 4;
  // The confidence of the job that decided the verdict, in [0, 1]. For a
  // derived row it is the highest path confidence among the supporting paths
  // (a path's confidence is the product of its legs').
  float confidence = 5;
  // How the row was obtained: "direct" (a stored verdict, or one inverted
  // into the source-to-target reading), "reverse" (a target-to-source
  // verdict with no named inverse, reported as stored) or "derived"
  // (composed through a hub control, transitive mode).
  string direction = 6;
  // For a derived row, every hub control on the pair's paths, sorted, joined
  // by "; "; empty otherwise.
  string hub_identifier = 7;
  // Jobs that judged this pair; a bidirectional job counts once, even when
  // its two directions disagree. For a derived row, the distinct jobs across
  // every leg of every path.
  int32 jobs_judged = 8;
  // Jobs with a verdict equal to the row's after normalizing to the
  // source-to-target reading. When one job's two directions disagree, the
  // job decides the row with its higher-confidence verdict (then the greater
  // relationship type). For a derived row, the distinct jobs across the legs
  // of the supporting paths.
  int32 jobs_agreeing = 9;
  // Every verdict other than the one that decided the row, newest first, as
  // "<word>@<confidence> (<job>)" joined by "; ", including verdicts equal to
  // the row's and both directions of a bidirectional job; empty when the row
  // has one verdict and for derived rows.
  string other_verdicts = 10;
  // The job that decided the row. For a derived row, the newest deciding job
  // among the supporting paths.
  string latest_job_id = 11;
  // Review notes joined by "; "; empty when nothing is flagged. Notes report
  // and never change the verdict. Three kinds: a one-to-many 'equivalent'
  // (one control equivalent to several in another catalog); a derived row
  // whose via paths disagree on the type; a derived row whose named verdict
  // rests on a minority of its paths.
  string review = 12;
  // For a derived row, the number of hub paths whose composition gives the
  // row's verdict; when the verdict is "type unknown" every path supports it.
  // 0 on non-derived rows.
  int32 paths_supporting = 13;
  // For a derived row, the number of all of the pair's hub paths. 0 on
  // non-derived rows.
  int32 paths_total = 14;
  // For a derived row, the hubs' published labels in the same order and
  // joined by the same "; " as hub_identifier; a hub without a label
  // contributes an empty string so positions line up (two unlabelled hubs
  // read "; "). Empty on non-derived rows, which have no hubs.
  string hub_label = 15;
}

// CrosswalkProvenance records exactly what produced a crosswalk, so a reader
// can reproduce it.
message CrosswalkProvenance {
  // pair, job, one_to_many or transitive.
  string mode = 1;
  CrosswalkStage stage = 2;
  // The catalogs the crosswalk covers, as the gateway resolved them.
  repeated CatalogSummary catalogs = 3;
  // The completed jobs that judged at least one row of the full result
  // (after filters, before pagination).
  repeated string job_ids = 4;
  // The number of rows before pagination.
  int64 rows = 5;
  // Edges skipped because an endpoint control is gone (catalog re-imported
  // or deleted).
  int64 skipped_missing_controls = 6;
  string server_version = 7;
  google.protobuf.Timestamp generated_at = 8;
  // Every completed job the request selected, sorted; job_ids is a subset.
  repeated string selected_job_ids = 9;
}

// GetCrosswalkRequest selects a crosswalk by mode, then narrows it with the
// filters. Exactly one mode must be set; the tenant comes from the
// authenticated identity.
message GetCrosswalkRequest {
  TenantContext tenant_context = 1;
  oneof mode {
    // Every pair judged between two catalogs, any completed job, either
    // direction, merged.
    CrosswalkPair pair = 2;
    // One completed job's verdicts.
    string job_id = 3;
    // One catalog against every catalog it has completed jobs with.
    string one_to_many_catalog_id = 4;
    // Rows from catalog A to catalog C derived through a hub catalog, plus
    // the direct A to C rows.
    CrosswalkTransitive transitive = 5;
  }
  // Defaults to synthesized, which serves only the mappings synthesis judged
  // viable (as ExportResults does); set include_non_viable to add the rest.
  CrosswalkStage stage = 6;
  // Drop rows below this confidence; in [0, 1].
  float min_confidence = 7;
  // Keep only these relationship types. NO_RELATIONSHIP is rejected: the
  // relationship analyzer does not store it, so a crosswalk lists related
  // pairs only.
  repeated RelationshipType relationship_types = 8;
  // Page size at most 1000. A page token is bound to the selection (jobs,
  // stage and filters) that issued it: if that selection changed since (a job
  // completed or was removed), the request fails with INVALID_ARGUMENT and the
  // export must be re-run.
  Pagination pagination = 9;
  // Set by the gateway from the tenant's completed jobs; client values are
  // ignored.
  repeated CrosswalkJob jobs = 10;
  // Set by the gateway: the catalogs the mode names, with the names and
  // versions to show; client values are ignored.
  repeated CatalogSummary catalogs = 11;
  // SYNTHESIZED stage only: also return the mappings synthesis filtered out as
  // not viable. Default false. Ignored for the ANALYZER stage, whose mappings
  // have no viability.
  bool include_non_viable = 12;
}

// GetCrosswalkResponse returns one page of rows. An empty rows list with
// provenance.job_ids empty means the catalogs are known but have no completed
// job between them.
message GetCrosswalkResponse {
  repeated CrosswalkRow rows = 1;
  PageInfo page_info = 2;
  CrosswalkProvenance provenance = 3;
}

message HealthRequest {
  string service = 1;  // Optional: specific service
}

message SubmitDocumentRequest {
  // TenantContext extracted from auth, not in request body
  oneof source {
    bytes content = 1;
    string source_uri = 2;
  }
  ContentMetadata metadata = 3;
  CatalogFormat catalog_format = 4;
  string catalog_name = 5;

  reserved 6, 7;
  reserved "target_catalog_id", "synthesis_config";
}

// Response of both upload RPCs (SubmitDocument, StreamDocument).
message SubmitDocumentResponse {
  string document_id = 2;
  string catalog_id = 4;
  // Every imported control that is not withdrawn and has neither requirement
  // text nor a usable title, in document order, with no cap. They keep their
  // place in the catalog but are not analysed; part_names lists the
  // control's parts that hold prose, the candidates for
  // catalog.requirement_part_names.
  repeated TextlessControl textless_controls = 5;

  reserved 1, 3;
  reserved "job_id", "status";
}

message StartAnalysisRequest {
  TenantContext tenant_context = 1;
  // ID of the catalog whose controls are mapped: the source of every pair.
  // A catalog the tenant imported (SubmitDocument/StreamDocument returns
  // it; ListCatalogs lists them). Required.
  string source_catalog_id = 2;
  SynthesisConfig synthesis_config = 3;
  // ID of the catalog the source controls are mapped onto: the target of
  // every pair. Required: StartAnalysis rejects an empty value with
  // InvalidArgument. Set it to source_catalog_id to analyse within one
  // catalog, which pairs that catalog's controls with each other in both
  // directions. The job classifies and embeds the controls of both
  // catalogs.
  string target_catalog_id = 4;
  // Also pair target controls with source controls (target to source), in
  // addition to the default source to target. The reverse direction's
  // sources are the target's controls, so the pair analyzers' LLM calls
  // scale with source plus target controls rather than source controls
  // alone. Rejected with InvalidArgument when target_catalog_id equals
  // source_catalog_id: within one catalog, controls are already paired in
  // both directions.
  bool bidirectional = 5;
  // Skip result-cache lookups: every LLM call is sent to the model (a
  // fresh, reproducible run), and the results are still stored for later
  // jobs. Recorded in the job's config, so its attestation proves the mode.
  bool no_cache = 6;
}

message StartAnalysisResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message GetControlMappingsRequest {
  // TenantContext from auth
  string control_id = 1;
  float min_confidence = 2;
  // Max mappings returned (0 = 50, max 1000); no further pages — use ListJobMappings to page
  int32 limit = 3;
}

message GetControlMappingsResponse {
  repeated ControlMapping mappings = 1;
  PageInfo page_info = 2;
}

message QueryGraphRequest {
  // TenantContext from auth
  string cypher = 1;  // Restricted subset validated at gateway
  map<string, string> parameters = 2;
  reserved 3;
}

message QueryGraphResponse {
  QueryResponse response = 1;
}

message FindSimilarRequest {
  // TenantContext from auth
  string control_id = 1;
  int32 limit = 2;
  repeated string catalog_ids = 3;
}

message FindSimilarResponse {
  SimilaritySearchResponse response = 1;
}

message StreamDocumentChunk {
  oneof payload {
    StreamDocumentMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message StreamDocumentMetadata {
  CatalogFormat catalog_format = 1;
  string catalog_name = 2;
  ContentMetadata content_metadata = 5;

  reserved 3, 4;
  reserved "target_catalog_id", "synthesis_config";
}

syntax = "proto3";

package crosscodex.v1;

import "crosscodex/v1/catalog.proto";
import "crosscodex/v1/common.proto";
import "crosscodex/v1/synthesis.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// PipelineService orchestrates end-to-end job workflows.
//
// COUPLING: Orchestrates all services
// (ingestion → catalog → analysis → synthesis → graph)
// RETRY LOGIC: Exponential backoff with jitter, max attempts
service PipelineService {
  // Create full analysis pipeline job
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);

  // Get job status and progress
  rpc GetJob(GetJobRequest) returns (GetJobResponse);

  // List jobs
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Cancel running job
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Retry failed job
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);

  // Get job execution trace
  rpc GetJobTrace(GetJobTraceRequest) returns (GetJobTraceResponse);
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  // Imported catalog → analysis → synthesis → graph
  JOB_TYPE_FULL_ANALYSIS = 1;
  // Re-analyze changed controls only
  JOB_TYPE_INCREMENTAL_SYNC = 2;
  // Document → catalog only
  JOB_TYPE_CATALOG_IMPORT = 3;
  // Re-run synthesis on existing analyses
  JOB_TYPE_SYNTHESIS_ONLY = 4;
}

message CreateJobRequest {
  TenantContext tenant_context = 1;
  JobType job_type = 2;
  JobConfig config = 3;
}

message JobConfig {
  // The imported catalog whose controls are mapped (the source of every
  // pair). Required: CreateJob rejects a config without it. Import inputs
  // (content, format, name) belong to upload.
  string catalog_id = 3;
  // The imported catalog the source controls are mapped onto (the target of
  // every pair). Required: CreateJob rejects a config without it. Equal to
  // catalog_id for an analysis within one catalog. A stored config without
  // it predates cross-catalog analysis and runs within catalog_id.
  string target_catalog_id = 6;
  SynthesisConfig synthesis_config = 7;
  map<string, string> options = 8;
  // Also pair target controls with source controls (target to source).
  // CreateJob rejects it when target_catalog_id equals catalog_id: within
  // one catalog, controls are already paired in both directions.
  bool bidirectional = 9;
  // The source catalog's name and version when the job was created, so the
  // job keeps showing (and prompting with) the label it ran under after the
  // catalog is renamed by a re-import. Server-set: CreateJob, and RetryJob's
  // new job, overwrite it from the catalog store; a client-supplied value is
  // ignored. Absent in a config stored before snapshots.
  CatalogSnapshot source_catalog = 10;
  // The target catalog's name and version when the job was created; equal
  // to source_catalog within one catalog. Server-set as source_catalog is; a
  // client-supplied value is ignored.
  CatalogSnapshot target_catalog = 11;
  // Skip result-cache lookups (#243): every LLM call of the job is sent to
  // the model, and its results are still stored for later jobs to reuse.
  // Part of the stored config, so the job's attestation records the mode.
  // `crosscodex run start --no-cache`.
  bool no_cache = 12;

  reserved 1, 2, 4, 5;
  reserved "document_content", "document_uri", "catalog_format", "catalog_name";
}

// CatalogSnapshot is a catalog's label as recorded when a job was created.
message CatalogSnapshot {
  // The catalog the label belongs to: the JobConfig's catalog_id or
  // target_catalog_id.
  string catalog_id = 1;
  // The uploader's catalog_name, or the OSCAL metadata title.
  string name = 2;
  // The OSCAL metadata.version; empty when import recorded none.
  string version = 3;
}

message CreateJobResponse {
  string job_id = 1;
  JobStatus status = 2;
}

message PipelineJob {
  string job_id = 1;
  TenantContext tenant_context = 2;
  JobType job_type = 3;
  JobConfig config = 4;
  JobStatus status = 5;
  AuditMetadata audit = 6;
  ProvenanceMetadata provenance = 7;
  JobProgress progress = 8;
  Error error = 9;
  repeated JobStage stages = 10;
  // How each analyzer of the job used the LLM result cache (#243), one
  // entry per analyzer of the job, in stage order. Set by GetJob only when
  // its request sets include_cache_summaries (never by ListJobs), and only
  // by the daemon: empty in embedded mode, without a
  // result cache, and for a tenant whose jobs are not attested (such jobs
  // reuse nothing).
  repeated AnalyzerCacheSummary cache_summaries = 11;
}

// ResultCacheMode is how one analyzer of a job used the LLM result cache.
enum ResultCacheMode {
  RESULT_CACHE_MODE_UNSPECIFIED = 0;
  // Requests were looked up; hits were reused and misses sent and stored.
  RESULT_CACHE_MODE_ENABLED = 1;
  // The job was started with no_cache: nothing was looked up; every
  // result was sent to the model and stored for later jobs.
  RESULT_CACHE_MODE_BYPASSED = 2;
  // analysis.result_cache.enabled is false for the tenant, or the daemon
  // ran the stage without the result cache: nothing was looked up or
  // stored. reason says which.
  RESULT_CACHE_MODE_DISABLED = 3;
  // The analyzer was not cached; reason says why.
  RESULT_CACHE_MODE_SKIPPED = 4;
  // The stage completed in an earlier run of the job that recorded no
  // result-cache attempt, so its link was signed as unrecorded: its cache
  // use is not known (it was not necessarily disabled). reason says why.
  RESULT_CACHE_MODE_UNRECORDED = 5;
}

// ResultCacheAttestation is whether a signature vouches for an analyzer's
// cache summary.
enum ResultCacheAttestation {
  RESULT_CACHE_ATTESTATION_UNSPECIFIED = 0;
  // A signature vouches for the summary. Usually it is from the stage run
  // that completed the analyzer, whose records still match the digest its
  // signed cache checkpoint names. A completed analyzer that kept no cache
  // records (mode disabled or unrecorded) instead takes its mode and reason
  // from its signed attestation link, over the result stored now, and its
  // counts are empty.
  RESULT_CACHE_ATTESTATION_ATTESTED = 1;
  // No signature vouches for the analyzer's cache use: the job is not
  // running and the analyzer has no verifiable completed stage run, its
  // records changed after signing, or its signed records could not be read
  // (object storage failed). A stage signed as unrecorded is not this; it
  // is attested with mode unrecorded. Every other field but analyzer is
  // empty.
  RESULT_CACHE_ATTESTATION_UNATTESTED = 2;
  // The job is running and the analyzer has not completed yet. Every other
  // field but analyzer is empty.
  RESULT_CACHE_ATTESTATION_IN_PROGRESS = 3;
}

// AnalyzerCacheSummary is one analyzer's use of the LLM result cache in
// one job, from the stage run that completed it (see attestation).
message AnalyzerCacheSummary {
  // The analyzer (stage) name, such as "classify".
  string analyzer = 1;
  ResultCacheMode mode = 2;
  // Human-readable notes on the mode, joined with "; ": why the analyzer
  // was skipped or the cache disabled, that the job was started with
  // --no-cache (bypassed), which aliases were not cached and why, and how
  // many tasks were not cached and why (for example, no catalog is known
  // for their controls). Empty when every task was cached as the mode says.
  string reason = 3;
  // Tasks the stage had, results reused from the cache, and calls sent to
  // the model. hits + dispatched is at most tasks: the rest (sections,
  // skipped controls) need no LLM call.
  int64 tasks = 4;
  int64 hits = 5;
  int64 dispatched = 6;
  // The concrete model behind each alias the analyzer used.
  repeated AnalyzerCacheModel models = 7;
  // The earlier jobs whose results were reused that the caller created.
  // Other users' jobs are only counted (other_producer_jobs): GetJob is
  // owner-only, so naming them would reveal that they exist. Full IDs are
  // in the job's audit record (job_cache_entries), which the digest of the
  // analyzer link's <analyzer>.cache_manifest material pins.
  repeated string producer_job_ids = 8;
  int64 other_producer_jobs = 9;
  // Whether a signed cache checkpoint vouches for the fields above.
  ResultCacheAttestation attestation = 10;
}

// AnalyzerCacheModel is the model the gateway reported for one alias in
// one job, the deployment that served it, and the operator-declared
// revision (llm.model_revisions).
message AnalyzerCacheModel {
  // The alias as the gateway receives it; a task's empty alias shows as the
  // tenant default it resolved to.
  string alias = 1;
  // Empty when the alias was not cached in this job (the reason says why).
  // A gateway that echoes the alias reports the alias here.
  string observed_model = 2;
  string revision = 3;
  // The deployment ID the gateway sent with the probe's response (LiteLLM's
  // x-litellm-model-id header, a hash of the deployment's settings that
  // changes when the model behind the alias changes); empty when it sent
  // none. Part of the cache key, like observed_model and revision.
  string deployment = 4;
}

message JobProgress {
  int32 total_steps = 1;
  int32 completed_steps = 2;
  int32 failed_steps = 3;
  float completion_percentage = 4;
  google.protobuf.Timestamp estimated_completion = 5;
  // Stages ended by a cancellation; counted apart from failed_steps.
  int32 cancelled_steps = 6;
}

message JobStage {
  string stage_id = 1;
  // ingestion, catalog_parse, analysis, synthesis, graph
  string stage_name = 2;
  JobStatus status = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp completed_at = 5;
  int32 retry_count = 6;
  Error error = 7;
  repeated ResourceRef outputs = 8;
}

message GetJobRequest {
  TenantContext tenant_context = 1;
  string job_id = 2;
  // Set to also return the job's cache_summaries (#243). Reading them
  // verifies signed records in object storage, so only callers that show
  // them (crosscodex run status) set it. The gateway reads them only after
  // it has checked that the caller owns the job or is an admin.
  bool include_cache_summaries = 3;
}

message GetJobResponse {
  PipelineJob job = 1;
}

message ListJobsRequest {
  TenantContext tenant_context = 1;
  JobStatus status = 2;  // Optional filter
  JobType job_type = 3;  // Optional filter
  ListOptions options = 4;
}

message ListJobsResponse {
  repeated PipelineJob jobs = 1;
  PageInfo page_info = 2;
}

message CancelJobRequest {
  TenantContext tenant_context = 1;
  string job_id = 2;
  string reason = 3;
}

message CancelJobResponse {
  bool cancelled = 1;
}

message RetryJobRequest {
  TenantContext tenant_context = 1;
  string job_id = 2;
  bool retry_from_failure = 3;
}

message RetryJobResponse {
  string new_job_id = 1;
}

message GetJobTraceRequest {
  TenantContext tenant_context = 1;
  string job_id = 2;
}

message GetJobTraceResponse {
  repeated TraceEvent events = 1;
}

message TraceEvent {
  google.protobuf.Timestamp timestamp = 1;
  string stage_name = 2;
  string event_type = 3;  // "stage_started", "rpc_called", "stage_completed"
  map<string, string> details = 4;
  string trace_id = 5;  // OpenTelemetry trace ID
  string span_id = 6;
}

syntax = "proto3";

package crosscodex.v1;

import "crosscodex/v1/common.proto";

// protolint:disable:next MAX_LINE_LENGTH
option go_package = "github.com/complytime-labs/crosscodex/api/gen/go/crosscodex/v1;crosscodexv1";

// SynthesisService aggregates analysis results and computes rankings.
//
// COUPLING: Consumes analysis.AnalysisResult, feeds graph.CreateEdge
// PROCESS: analysis results → ranking → viability → graph insertion
service SynthesisService {
  // Create synthesis job for catalog pair
  rpc CreateSynthesis(CreateSynthesisRequest) returns (CreateSynthesisResponse);

  // Get synthesis status
  rpc GetSynthesis(GetSynthesisRequest) returns (GetSynthesisResponse);

  // List syntheses
  rpc ListSyntheses(ListSynthesesRequest) returns (ListSynthesesResponse);

  // Get quality metrics
  rpc GetQualityMetrics(GetQualityMetricsRequest)
      returns (GetQualityMetricsResponse);
}

message CreateSynthesisRequest {
  TenantContext tenant_context = 1;
  string source_catalog_id = 2;
  string target_catalog_id = 3;
  string job_id = 4;
  SynthesisConfig config = 5;
}

message SynthesisConfig {
  float confidence_threshold = 1;      // Min for viable mapping (default 0.5)
  int32 max_mappings_per_control = 2;  // Top N to keep (default 10)
}

message CreateSynthesisResponse {
  string synthesis_id = 1;
  JobStatus status = 2;
}

enum SynthesisStatus {
  SYNTHESIS_STATUS_UNSPECIFIED = 0;
  SYNTHESIS_STATUS_PENDING = 1;
  SYNTHESIS_STATUS_ANALYZING = 2;
  SYNTHESIS_STATUS_RANKING = 3;
  SYNTHESIS_STATUS_COMPLETED = 4;
  SYNTHESIS_STATUS_FAILED = 5;
}

message Synthesis {
  string synthesis_id = 1;
  TenantContext tenant_context = 2;
  string source_catalog_id = 3;
  string target_catalog_id = 4;
  string job_id = 5;
  SynthesisStatus status = 6;
  SynthesisConfig config = 7;
  AuditMetadata audit = 8;
  ProvenanceMetadata provenance = 9;
  QualityMetrics metrics = 10;
  Error error = 11;
}

message GetSynthesisResponse {
  Synthesis synthesis = 1;
}

message GetSynthesisRequest {
  TenantContext tenant_context = 1;
  string synthesis_id = 2;
}

message ListSynthesesRequest {
  TenantContext tenant_context = 1;
  ListOptions options = 2;
}

message ListSynthesesResponse {
  repeated Synthesis syntheses = 1;
  PageInfo page_info = 2;
}

enum RelationshipType {
  RELATIONSHIP_TYPE_UNSPECIFIED = 0;
  RELATIONSHIP_TYPE_EQUIVALENT = 1;      // NIST IR 8477: same scope and intent
  RELATIONSHIP_TYPE_SUPERSET_OF = 2;     // NIST IR 8477: source is broader
  RELATIONSHIP_TYPE_SUBSET_OF = 3;       // NIST IR 8477: source is narrower
  RELATIONSHIP_TYPE_CONTRIBUTES_TO = 4;  // NIST IR 8477: target advances source
  RELATIONSHIP_TYPE_COMPLEMENTS = 5;     // NIST IR 8477: different mechanism
  RELATIONSHIP_TYPE_PARTIAL = 6;         // NIST IR 8477: tangential connection
  RELATIONSHIP_TYPE_CONFLICTS_WITH = 7;  // NIST IR 8477: direct contradiction
  RELATIONSHIP_TYPE_NO_RELATIONSHIP = 8; // NIST IR 8477: no relationship
}

// ContributionType sub-classifies CONTRIBUTES_TO relationships.
enum ContributionType {
  CONTRIBUTION_TYPE_UNSPECIFIED = 0;
  CONTRIBUTION_TYPE_INTEGRAL_TO = 1;  // Source requires target
  CONTRIBUTION_TYPE_EXAMPLE_OF = 2;   // Target is one way among alternatives
}

// ConfidenceLevel categorizes LLM-reported confidence.
enum ConfidenceLevel {
  CONFIDENCE_LEVEL_UNSPECIFIED = 0;
  CONFIDENCE_LEVEL_HIGH = 1;
  CONFIDENCE_LEVEL_MEDIUM = 2;
  CONFIDENCE_LEVEL_LOW = 3;
}

message ControlMapping {
  string mapping_id = 1;
  string source_control_id = 2;
  string target_control_id = 3;
  RelationshipType relationship_type = 4;
  // 0 to 1: the relationship panel's agreement (votes for relationship_type /
  // valid votes) times the mean analysis.relationship.confidence_weights
  // weight of those votes' self-reported CONFIDENCE. The agreement alone is
  // the agreement_fraction property of the mapping's SEMANTIC_MATCH edge.
  float confidence = 5;
  float viability_score = 6;
  bool is_viable = 7;
  repeated AnalyzerContribution contributions = 8;
  TemporalAttributes temporal = 9;
  ProvenanceMetadata provenance = 10;
  // The critique stage's review of this ANALYZER-stage mapping. Unset for
  // SYNTHESIZED mappings, for jobs that did not run the critique stage, and
  // for a pair the critique produced no result for (kept unreviewed).
  MappingCritique critique = 11;
}

// MappingCritique is the critique panel's review of one relationship verdict.
// upheld + rejected + failed is the panel size.
message MappingCritique {
  // The panel rejected the verdict, so it is not a mapping: it is left out of
  // the graph, synthesis and default listings. Listed only with
  // ListJobMappingsRequest.include_vetoed.
  bool vetoed = 1;
  // Votes that upheld the verdict.
  int32 upheld = 2;
  // Votes that rejected the verdict.
  int32 rejected = 3;
  // Votes with no valid verdict (task error or unreadable response).
  int32 failed = 4;
  // One entry per panel vote, in panel order: "<model alias> s<sample>
  // <UPHOLD|REJECT|FAILED>: <reason>". The reasons are model output: escape
  // them before rendering.
  repeated string reasons = 5;
}

message AnalyzerContribution {
  string analyzer_id = 1;
  string analyzer_type_name = 2;  // String representation of AnalyzerType
  float confidence = 3;
  RelationshipType suggested_type = 4;
  map<string, string> evidence = 5;
}

message QualityMetrics {
  int32 total_mappings = 1;
  int32 viable_mappings = 2;
  float avg_confidence = 3;
  float avg_viability = 4;
  map<string, int32> relationship_type_counts = 5;
  // field 6 reserved for future analyzer_agreement_scores
  AuditMetadata computed_at = 7;
  repeated DiagnosticEntry diagnostics = 8;
}

message GetQualityMetricsRequest {
  TenantContext tenant_context = 1;
  string synthesis_id = 2;
}

message GetQualityMetricsResponse {
  QualityMetrics metrics = 1;
}

// DiagnosticSeverity indicates the severity of a quality diagnostic finding.
enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_GOOD = 1;
  DIAGNOSTIC_SEVERITY_WARN = 2;
  DIAGNOSTIC_SEVERITY_POOR = 3;
  DIAGNOSTIC_SEVERITY_CRITICAL = 4;
}

// DiagnosticEntry represents a single quality diagnostic finding.
message DiagnosticEntry {
  string category = 1;
  DiagnosticSeverity severity = 2;
  string message = 3;
  double value = 4;
}

// MappingStage selects which pipeline stage's mappings ListMappings reads.
enum MappingStage {
  MAPPING_STAGE_UNSPECIFIED = 0;  // Treated as SYNTHESIZED
  MAPPING_STAGE_SYNTHESIZED = 1;  // After synthesis confidence threshold and per-control cap
  MAPPING_STAGE_ANALYZER = 2;     // Raw relationship analyzer consensus; no viability
}

// ListJobMappingsRequest lists mappings. The gateway's ListJobMappings requires
// job_id; the gateway's GetControlMappings sends control_id without job_id to
// list synthesized mappings across all of the tenant's jobs.
message ListJobMappingsRequest {
  // Set by the gateway from the authenticated identity; a client value is
  // overwritten.
  TenantContext tenant_context = 1;
  string job_id = 2;
  MappingStage stage = 3;
  float min_confidence = 4;      // Inclusive lower bound in [0, 1]
  bool include_non_viable = 5;   // SYNTHESIZED only: include pairs synthesis filtered out
  // Empty means every type except NO_RELATIONSHIP.
  repeated RelationshipType relationship_types = 6;
  string control_id = 7;         // Optional: matches source or target
  Pagination pagination = 8;     // page_size default 50, max 1000
  // ANALYZER only: also list the pairs the critique stage vetoed, each with
  // its critique (ControlMapping.critique.vetoed is true). SYNTHESIZED never
  // holds vetoed pairs, so setting this with it is INVALID_ARGUMENT.
  bool include_vetoed = 9;
}

// ListJobMappingsResponse returns one page of mappings ordered by job, source,
// target. ControlMapping.viability_score and is_viable are meaningful only for
// SYNTHESIZED; ANALYZER mappings report is_viable = false.
message ListJobMappingsResponse {
  repeated ControlMapping mappings = 1;
  PageInfo page_info = 2;
  // What produced the job's mappings: its source and target catalogs and
  // direction. Set when the request names a job_id whose config names a
  // catalog, with the same tenant scope as the mappings; the same on every
  // page. Unset for a request across jobs (control_id without job_id).
  JobAnalysis analysis = 3;
}

// ListJobCandidatesRequest lists the relationship candidates of one completed
// job.
message ListJobCandidatesRequest {
  // Set by the gateway from the authenticated identity; a client value is
  // overwritten.
  TenantContext tenant_context = 1;
  // Required. The job must be completed, as for ListJobMappings; an unknown
  // job, or another tenant's job, is NOT_FOUND.
  string job_id = 2;
  // Optional: matches source or target.
  string control_id = 3;
  // page_size default 50, max 1000 (larger or negative is INVALID_ARGUMENT).
  Pagination pagination = 4;
}

// RelationshipCandidate is one source-target pair candidate generation
// proposed to the relationship analyzer.
message RelationshipCandidate {
  string source_control_id = 1;
  string target_control_id = 2;
  // Embedding cosine similarity in [0, 100]. 0 when no embedding exists for
  // the pair.
  float similarity_score = 3;
  // One per generator that proposed the pair. Empty unless the candidate
  // strategy is rank fusion.
  repeated CandidateContribution contributions = 4;
}

// CandidateContribution is one generator's share of a candidate pair.
message CandidateContribution {
  // The generator that proposed the pair.
  string generator = 1;
  // The generator's own score for the pair.
  double score = 2;
  // The weight the fusion gave the generator.
  double weight = 3;
  // Generator-specific details.
  map<string, string> metadata = 4;
}

// ListJobCandidatesResponse returns one page of candidates ordered by source,
// then target.
message ListJobCandidatesResponse {
  repeated RelationshipCandidate candidates = 1;
  PageInfo page_info = 2;
  // What produced the job's candidates; the same on every page. See
  // ListJobMappingsResponse.analysis.
  JobAnalysis analysis = 3;
}

// JobAnalysis is the catalog selection of an analysis job.
message JobAnalysis {
  // The catalog whose controls were mapped onto the target's.
  CatalogSummary source_catalog = 1;
  // The catalog the source's controls were mapped onto. Equal to
  // source_catalog for an analysis within one catalog.
  CatalogSummary target_catalog = 2;
  // The target's controls were mapped onto the source's too. Always false
  // within one catalog, whose controls are paired in both directions.
  bool bidirectional = 3;
}

// CatalogSummary identifies an imported catalog for display.
message CatalogSummary {
  // The catalog's ID as the job's config names it; set even when imported is
  // false. Derived at import from the document's content and the tenant, so
  // it binds the job to the exact catalog contents it mapped.
  string catalog_id = 1;
  // The uploader's catalog_name, or the OSCAL metadata title: as recorded
  // when the job was created when snapshot is true, else the catalog's
  // current name.
  string name = 2;
  // The OSCAL metadata.version, recorded or current as name is; empty when
  // import recorded none.
  string version = 3;
  // False when the tenant no longer has the catalog (deleted or purged after
  // the job ran). Name and version are then empty unless snapshot is true.
  bool imported = 4;
  // True when name and version were recorded when the job was created
  // (JobConfig.source_catalog / target_catalog). False for a job created
  // before snapshots: name and version are then the catalog's current ones,
  // which a re-import under another name changes.
  bool snapshot = 5;
}

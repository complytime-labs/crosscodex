name: crosscodexd black-box E2E - OSCAL ingest to AGE structural surface (Tier A)

vars:
  root: "."
  fixture: "cmd/crosscodexd/testdata/oscal/e2e-minimal-catalog.json"
  gateway_url: "https://127.0.0.1:18443/crosscodex.v1.GatewayService/SubmitDocument"
  # DB DSN with absolute cert paths (venom runs scripts from a temp dir)
  ca_cert: ""
  client_cert: ""
  client_key: ""

testcases:
  - name: Preflight - verify required tools
    steps:
      - type: exec
        script: command -v psql >/dev/null 2>&1
        assertions:
          - result.code ShouldEqual 0
        info: "psql required for DB assertions - install postgresql-client"
      - type: exec
        script: command -v pg_isready >/dev/null 2>&1
        assertions:
          - result.code ShouldEqual 0
        info: "pg_isready required for DB health - install postgresql-client"
      - type: exec
        script: command -v jq >/dev/null 2>&1
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: command -v base64 >/dev/null 2>&1
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: command -v curl >/dev/null 2>&1
        assertions:
          - result.code ShouldEqual 0

  - name: Submit inline OSCAL catalog via mTLS Connect JSON
    steps:
      - type: exec
        script: |
          base64_content=$(base64 -w 0 <{{.root}}/{{.fixture}})
          curl -sS --fail-with-body \
            --cacert {{.ca_cert}} \
            --cert {{.client_cert}} \
            --key {{.client_key}} \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"$base64_content\",\"catalogFormat\":\"CATALOG_FORMAT_OSCAL\",\"catalogName\":\"e2e\"}" \
            {{.gateway_url}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.jobId ShouldNotBeEmpty
        vars:
          job_id:
            from: result.systemoutjson.jobId

  - name: Controls persisted in relational DB (controls table)
    steps:
      - type: exec
        script: |
          # Short bounded retry to tolerate minor lag (though sync is expected)
          DSN="postgres://postgres:integration@localhost:15432/crosscodex_test?sslmode=verify-full&sslrootcert={{.ca_cert}}&sslcert={{.client_cert}}&sslkey={{.client_key}}"
          for i in $(seq 1 15); do
            count=$(psql "$DSN" -tAc "SELECT count(*) FROM controls WHERE tenant_id='e2e';")
            if [ "$count" = "3" ]; then
              echo "$count"
              exit 0
            fi
            sleep 1
          done
          echo "$count"
          exit 1
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "3"

  - name: Control nodes materialized in AGE
    steps:
      - type: exec
        script: |
          DSN="postgres://postgres:integration@localhost:15432/crosscodex_test?sslmode=verify-full&sslrootcert={{.ca_cert}}&sslcert={{.client_cert}}&sslkey={{.client_key}}"
          PGOPTIONS='-c search_path=ag_catalog,public' psql "$DSN" -tAc \
            "SELECT count(*) FROM cypher('crosscodex_e2e', \$\$ MATCH (n:Control) RETURN n \$\$) AS (v agtype);"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "3"

  - name: PARENT_OF edges materialized in AGE
    steps:
      - type: exec
        script: |
          DSN="postgres://postgres:integration@localhost:15432/crosscodex_test?sslmode=verify-full&sslrootcert={{.ca_cert}}&sslcert={{.client_cert}}&sslkey={{.client_key}}"
          PGOPTIONS='-c search_path=ag_catalog,public' psql "$DSN" -tAc \
            "SELECT count(*) FROM cypher('crosscodex_e2e', \$\$ MATCH ()-[r:PARENT_OF]->() RETURN r \$\$) AS (v agtype);"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "2"

name: smoke_up.sh hardening and key-separation gates fail closed

vars:
  root: "."

testcases:
  - name: A compliant stack passes both gates (the later nats client-identity probe is not stubbed)
    steps:
      - type: exec
        script: bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Hardening checks passed for 5 running container(s)."
          - result.systemout ShouldContainSubstring "Each key volume holds only its own files and is mounted only by the services that use it"
          - 'result.systemout ShouldNotContainSubstring "FAIL: hardening"'
          - 'result.systemout ShouldNotContainSubstring "FAIL: certs volume"'

  - name: An INGESTION_OVERLAYS exported in the caller's shell does not reach the smoke stack
    steps:
      - type: exec
        script: INGESTION_OVERLAYS=/leaked/compose.ingestion.yaml bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring task_compose_overlay=
          - result.systemout ShouldContainSubstring compose.offline.yaml
          - result.systemout ShouldNotContainSubstring /leaked/

  - name: A capability bit beyond the allowlist fails the service
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000001 256 -' 'nats 0000000000000000 256 -')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: hardening: service db: capabilities beyond its allowlist: bounding set 0x0000000000000001, allowed 0x0"'
          - result.systemout ShouldContainSubstring "1 hardening check(s) failed"
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service missing from the hardening table fails and names the fix
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'mystery 0000000000000000 256 -')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: hardening: service mystery: no expected hardening in test/deploy/smoke_up.sh; add the service to the hardening table"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A pids limit at the engine default fails
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000000 2048 -')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: hardening: service db: no pids limit below the engine default 2048"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A CA key in the client volume fails and names the volume
    steps:
      - type: exec
        script: |
          VOLUME_FILES='smoke-client-certs/ca-key.pem' \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: smoke-client-certs holds [.fingerprint ca-key.pem ca.pem client-key.pem client.pem ]"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service volume holding another service's key under its own file names fails
    steps:
      - type: exec
        script: |
          VOLUME_FILES='crosscodex-smoke-certs-db/server-key.pem=nats' \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: server-key.pem in crosscodex-smoke-certs-db is not db-key.pem from the host PKI; a service may hold only its own key."'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service volume holding an extra key file fails and names the volume
    steps:
      - type: exec
        script: |
          VOLUME_FILES='crosscodex-smoke-certs-nats/client-key.pem' \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: crosscodex-smoke-certs-nats holds [.fingerprint ca.pem client-key.pem server-key.pem server.pem ]"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service container that can see another service's key fails
    steps:
      - type: exec
        script: |
          PRESENT='nats:/certs/db-key.pem' \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: service nats holds /certs/db-key.pem"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A client key visible in a service container fails
    steps:
      - type: exec
        script: |
          PRESENT='db:/certs/client-key.pem' \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: service db holds /certs/client-key.pem"'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service mounting another service's volume fails
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000000 256 crosscodex-smoke-certs-db' 'nats 0000000000000000 256 crosscodex-smoke-certs-nats,crosscodex-smoke-certs-db' 'litellm-tls 0000000000000000 256 crosscodex-smoke-certs-litellm' 'migrate 0000000000000000 256 smoke-client-certs' 'crosscodexd 0000000000000000 256 crosscodex-smoke-certs-crosscodexd,smoke-client-certs,smoke-attestation-keys')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: service nats mounts crosscodex-smoke-certs-db; the only services allowed to mount it: db."'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: The client volume mounted by an unexpected service fails
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000000 256 crosscodex-smoke-certs-db,smoke-client-certs' 'nats 0000000000000000 256 crosscodex-smoke-certs-nats' 'litellm-tls 0000000000000000 256 crosscodex-smoke-certs-litellm' 'migrate 0000000000000000 256 smoke-client-certs' 'crosscodexd 0000000000000000 256 crosscodex-smoke-certs-crosscodexd,smoke-client-certs,smoke-attestation-keys')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: service db mounts smoke-client-certs; the only services allowed to mount it: migrate crosscodexd."'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: The attestation volume mounted by migrate fails
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000000 256 crosscodex-smoke-certs-db' 'nats 0000000000000000 256 crosscodex-smoke-certs-nats' 'litellm-tls 0000000000000000 256 crosscodex-smoke-certs-litellm' 'migrate 0000000000000000 256 smoke-client-certs,smoke-attestation-keys' 'crosscodexd 0000000000000000 256 crosscodex-smoke-certs-crosscodexd,smoke-client-certs,smoke-attestation-keys')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "FAIL: certs volume: service migrate mounts smoke-attestation-keys; the only services allowed to mount it: crosscodexd."'
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

  - name: A service not seen mounting its own volume fails, so the mount check cannot pass vacuously
    steps:
      - type: exec
        script: |
          TABLE="$(printf '%s\n' 'db 0000000000000000 256 -' 'nats 0000000000000000 256 crosscodex-smoke-certs-nats' 'litellm-tls 0000000000000000 256 crosscodex-smoke-certs-litellm' 'migrate 0000000000000000 256 smoke-client-certs' 'crosscodexd 0000000000000000 256 crosscodex-smoke-certs-crosscodexd,smoke-client-certs,smoke-attestation-keys')" \
            bash {{.root}}/test/tooling/lib/smoke-up-hardening.sh {{.root}}
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldContainSubstring \"FAIL: certs volume: mount check did not see 'db crosscodex-smoke-certs-db'\""
          - result.systemout ShouldContainSubstring "smoke_up exit=1"

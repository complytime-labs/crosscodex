name: eval-crosswalk run.sh drives the CLI, polls the job and scores it

vars:
  root: "."

# run.sh talks to a fake CLI (test/tooling/lib/fake-crosscodex.sh) that records
# its argv and replays canned JSON; the real crosswalk-eval tool scores it.
testcases:
  - name: build the eval tool
    steps:
      - type: exec
        script: |
          cd {{.root}} && go build -o .test-output/eval/tooling-bin/crosswalk-eval ./test/eval/crosswalk/cmd/crosswalk-eval; echo "exit=$?"
        assertions:
          - result.systemout ShouldContainSubstring exit=0

  - name: the happy path scores the run and starts it with the result cache on
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/happy" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/happy"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/happy"
        env: "PROFILE=synth-run LABEL=t1"
        assertions:
          - result.systemout ShouldContainSubstring exit=0
      - type: exec
        script: |
          w="{{.root}}/.test-output/eval/tooling-run/happy"
          test -s "$w/out/synth-run/t1/report.json" && echo "report=yes" || echo "report=no"
          echo "import_count=$(grep -c 'catalog import' "$w/argv.log")"
          grep 'run start' "$w/argv.log" | grep -q -- '--no-cache' && echo "nocache=yes" || echo "nocache=no"
          grep -q -- 'run start --source cat-1 --target cat-2 ' "$w/argv.log" && echo "start_ids=ok"
          grep -q -- 'results export job-synth --stage analyzer --format json' "$w/argv.log" && echo "export=yes"
          grep -q -- 'results candidates job-synth --format json' "$w/argv.log" && echo "candidates=yes"
          grep -q -- '--endpoint https://localhost:1 --tls-ca ca.pem --tls-cert client.pem --tls-key client-key.pem' "$w/argv.log" && echo "tls=yes"
        assertions:
          - result.systemout ShouldContainSubstring report=yes
          - result.systemout ShouldContainSubstring import_count=2
          - result.systemout ShouldContainSubstring nocache=no
          - result.systemout ShouldContainSubstring start_ids=ok
          - result.systemout ShouldContainSubstring export=yes
          - result.systemout ShouldContainSubstring candidates=yes
          - result.systemout ShouldContainSubstring tls=yes

  - name: NO_CACHE=1 adds --no-cache to run start
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/nocache" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/nocache"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/nocache"
        env: "PROFILE=synth-run LABEL=t1 NO_CACHE=1"
        assertions:
          - result.systemout ShouldContainSubstring exit=0
      - type: exec
        script: |
          grep 'run start' "{{.root}}/.test-output/eval/tooling-run/nocache/argv.log" | grep -q -- '--no-cache' && echo "nocache=yes" || echo "nocache=no"
        assertions:
          - result.systemout ShouldContainSubstring nocache=yes

  - name: human mode prints the report, llm mode only the summary line
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/human" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/human"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/human"
        env: "PROFILE=synth-run LABEL=t1"
        assertions:
          - result.systemout ShouldContainSubstring exit=0
          - result.systemout ShouldContainSubstring synth-run
          - result.systemout ShouldContainSubstring Recall
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/llm" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/llm"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/llm"
        env: "PROFILE=synth-run LABEL=t1 MODE=llm"
        assertions:
          - result.systemout ShouldContainSubstring exit=0
      - type: exec
        script: |
          # llm mode still writes the full report to disk.
          echo "report_exists=$(test -s "{{.root}}/.test-output/eval/tooling-run/llm/out/synth-run/t1/report.md" && echo yes)"
        assertions:
          - result.systemout ShouldContainSubstring report_exists=yes

  - name: llm mode output is exactly the summary line
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/llmlines" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/llmlines"
      - type: exec
        script: |
          out=$(env ROOT_DIR={{.root}} PROFILES_DIR={{.root}}/test/eval/crosswalk/testdata/profiles EVAL_OUT_DIR="{{.root}}/.test-output/eval/tooling-run/llmlines/out" \
            FAKE_ARGV_LOG="{{.root}}/.test-output/eval/tooling-run/llmlines/argv.log" FAKE_FIXTURES={{.root}}/test/eval/crosswalk/testdata/run \
            CROSSCODEX_BIN={{.root}}/test/tooling/lib/fake-crosscodex.sh EVAL_BIN={{.root}}/.test-output/eval/tooling-bin/crosswalk-eval \
            EVAL_ENDPOINT=https://localhost:1 EVAL_CA=a EVAL_CERT=b EVAL_KEY=c \
            PROFILE=synth-run LABEL=t1 MODE=llm bash {{.root}}/test/eval/crosswalk/run.sh 2>&1)
          echo "lines=$(printf '%s\n' "$out" | grep -c .)"
        assertions:
          - result.systemout ShouldContainSubstring lines=1

  - name: an unknown profile fails and lists the available ones
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/unknown" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/unknown"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/unknown"
        env: "PROFILE=nope"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring unknown profile
          - result.systemout ShouldContainSubstring synth-run

  - name: a profile name that is a path is rejected
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/badprofile" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/badprofile"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/badprofile"
        env: "PROFILE=../x"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring invalid PROFILE

  - name: an invalid LABEL is rejected
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/badlabel" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/badlabel"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/badlabel"
        env: "PROFILE=synth-run LABEL=a/b"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring invalid LABEL

  - name: an existing run directory is never overwritten
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/exists" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/exists" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/exists/out/synth-run/t1" && echo keep >"{{.root}}/.test-output/eval/tooling-run/exists/out/synth-run/t1/marker"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/exists"
        env: "PROFILE=synth-run LABEL=t1"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring synth-run/t1 already exists
          - result.systemout ShouldContainSubstring another LABEL
      - type: exec
        script: |
          echo "marker=$(cat "{{.root}}/.test-output/eval/tooling-run/exists/out/synth-run/t1/marker")"
          echo "calls=$(grep -c . "{{.root}}/.test-output/eval/tooling-run/exists/argv.log")"
        assertions:
          - result.systemout ShouldContainSubstring marker=keep
          - result.systemout ShouldContainSubstring calls=0

  - name: a failed job fails the run and prints the job error
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/failed" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/failed"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/failed"
        env: "PROFILE=synth-run LABEL=t1 FAKE_JOB_STATUS=JOB_STATUS_FAILED FAKE_JOB_ERROR=embedding_coverage_too_low"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring JOB_STATUS_FAILED
          - result.systemout ShouldContainSubstring embedding_coverage_too_low
      - type: exec
        script: |
          test -e "{{.root}}/.test-output/eval/tooling-run/failed/out/synth-run/t1/report.json" && echo "report=yes" || echo "report=no"
        assertions:
          - result.systemout ShouldContainSubstring report=no

  - name: a job that stays running times out
    steps:
      - type: exec
        script: rm -rf "{{.root}}/.test-output/eval/tooling-run/timeout" && mkdir -p "{{.root}}/.test-output/eval/tooling-run/timeout"
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/timeout"
        env: "PROFILE=synth-run LABEL=t1 FAKE_JOB_STATUS=JOB_STATUS_RUNNING EVAL_TIMEOUT=1"
        assertions:
          - result.systemout ShouldNotContainSubstring exit=0
          - result.systemout ShouldContainSubstring timed out

  - name: a quoted target path with spaces and a hash is imported exactly as the tool resolved it
    steps:
      - type: exec
        script: |
          w="{{.root}}/.test-output/eval/tooling-run/quoted"
          rm -rf "$w" && mkdir -p "$w/root/cat dir" "$w/profiles"
          cp "{{.root}}/test/eval/crosswalk/testdata/source_a.json" "$w/root/cat dir/src.json"
          cp "{{.root}}/test/eval/crosswalk/testdata/synthetic_catalog.json" "$w/root/cat dir/t #1.json"
          cat >"$w/profiles/quoted.yaml" <<'YAML'
          name: quoted
          source: "cat dir/src.json"
          target: "cat dir/t #1.json"
          controls: [s-1, s-2]
          references:
            oscal_links:
              rel: x_ref
              resource:
                title: '^SYNTHTARGET$'
              identifier: link_text
              separator: ','
          YAML
      - type: run-eval-crosswalk
        root: "{{.root}}"
        work: "{{.root}}/.test-output/eval/tooling-run/quoted"
        env: "PROFILE=quoted LABEL=t1 ROOT_DIR={{.root}}/.test-output/eval/tooling-run/quoted/root PROFILES_DIR={{.root}}/.test-output/eval/tooling-run/quoted/profiles"
        assertions:
          - result.systemout ShouldContainSubstring exit=0
      - type: exec
        script: |
          grep -qF -- 'catalog import /' "{{.root}}/.test-output/eval/tooling-run/quoted/argv.log" && echo "absolute=yes"
          grep -qF -- 'root/cat dir/t #1.json' "{{.root}}/.test-output/eval/tooling-run/quoted/argv.log" && echo "target=imported"
        assertions:
          - result.systemout ShouldContainSubstring absolute=yes
          - result.systemout ShouldContainSubstring target=imported

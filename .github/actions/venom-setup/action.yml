name: Venom Setup
description: Install the pinned Venom E2E test runner binary onto the runner

runs:
  using: composite
  steps:
    - name: Install Venom
      shell: bash
      # Pinned by tag AND SHA-256: ovh/venom publishes no checksum file, and an
      # unverified binary download runs with the workspace mounted. Bump the tag
      # and digest together.
      env:
        VENOM_VERSION: v1.3.0
        SHA_LINUX_AMD64: 89832ec25e820c605cf0d3c09122e60bad43d13c1724aa6d375ef7109fbfe201
      run: |
        set -euo pipefail
        curl -fsSL -o venom "https://github.com/ovh/venom/releases/download/${VENOM_VERSION}/venom.linux-amd64"
        echo "${SHA_LINUX_AMD64}  venom" | sha256sum -c -
        chmod +x venom
        sudo mv venom /usr/local/bin/venom
        venom version

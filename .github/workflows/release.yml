name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/go-setup
        with:
          github-token: ${{ github.token }}

      - name: Build
        run: task build

      - name: Lint
        run: task lint

      - name: Security scan
        run: task dev:vulncheck

      - name: Test
        run: task test

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          MODULE: github.com/complytime-labs/crosscodex
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.GitCommit=${GIT_COMMIT} -X ${MODULE}/internal/version.BuildDate=${BUILD_DATE}"

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            echo "Building for ${os}/${arch}..."
            GOOS="${os}" GOARCH="${arch}" go build -ldflags "${LDFLAGS}" -o ".build/crosscodex-${os}-${arch}" ./cmd/crosscodex
            GOOS="${os}" GOARCH="${arch}" go build -ldflags "${LDFLAGS}" -o ".build/crosscodexd-${os}-${arch}" ./cmd/crosscodexd
          done

      - name: Generate checksums
        run: |
          cd .build
          sha256sum crosscodex-* crosscodexd-* > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --generate-notes \
            .build/crosscodex-linux-amd64 \
            .build/crosscodexd-linux-amd64 \
            .build/crosscodex-linux-arm64 \
            .build/crosscodexd-linux-arm64 \
            .build/crosscodex-darwin-amd64 \
            .build/crosscodexd-darwin-amd64 \
            .build/crosscodex-darwin-arm64 \
            .build/crosscodexd-darwin-arm64 \
            .build/checksums.txt

  images:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push crosscodexd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: crosscodexd
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            MODULE=github.com/complytime-labs/crosscodex
          tags: |
            ghcr.io/complytime-labs/crosscodexd:${{ github.ref_name }}
            ghcr.io/complytime-labs/crosscodexd:latest

      - name: Build and push crosscodex-cli
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: crosscodex-cli
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            MODULE=github.com/complytime-labs/crosscodex
          tags: |
            ghcr.io/complytime-labs/crosscodex-cli:${{ github.ref_name }}
            ghcr.io/complytime-labs/crosscodex-cli:latest

      - name: Build and push crosscodex-db
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/db
          file: deploy/db/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/complytime-labs/crosscodex-db:${{ github.ref_name }}
            ghcr.io/complytime-labs/crosscodex-db:latest

      - name: Build and push crosscodex-litellm-tls
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/litellm
          file: deploy/litellm/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/complytime-labs/crosscodex-litellm-tls:${{ github.ref_name }}
            ghcr.io/complytime-labs/crosscodex-litellm-tls:latest

# Backups (issue #36): WAL archiving on db, a shared backup volume, and the
# db-restore one-shot (profile "restore"). Use with the base file and the
# LLM gateway fragment you run (compose.gateway-praxis.yaml for praxis):
#   docker compose -f compose.yaml -f compose.gateway-litellm.yaml -f compose.backup.yaml up -d
# Needs backup.env (copy backup.env.example) and CROSSCODEX_BACKUP_DSN in .env.
# Procedures: README.md, "Backups".
#
# Volume layout (local destination): /backup is owned by crosscodexd
# (65532) and /backup/postgres by postgres (999), both group 10001 (the cert
# GID every service already joins) with mode 2770. crosscodexd writes base
# backups and backup points; postgres writes archived WAL. Both sides must
# read each other's output (verify lists archived WAL, restore fetches base
# backups). crosscodexd's WAL-G writes 0644 files in 0755 directories.
# Postgres runs archive_command with umask 0077, which would leave WAL
# unreadable to crosscodexd, so archive_command sets umask 0027 (0640 files
# in 0750 directories, group 10001 through the setgid bit).
# /backup/tmp (65532, mode 0700) is crosscodexd's TMPDIR: backups spool each
# object and the JetStream snapshot there (pkg/backup) instead of the /tmp
# tmpfs, which would count against the daemon's memory limit. The local
# destination's own files live under /backup/backup, so it never lists them.
services:
  backup-init:
    image: crosscodex-db:${TAG:-latest}
    user: "0:0"
    # Measured with the command below on a fresh and on an existing volume:
    # CHOWN for chown; FOWNER to chmod directories it no longer owns;
    # DAC_OVERRIDE to mkdir and look up inside /backup once it is 2770
    # 65532:10001; FSETID or the kernel silently drops the setgid bit (2770
    # becomes 770) because root is not in group 10001.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID]
    security_opt: [no-new-privileges:true]
    mem_limit: ${CROSSCODEX_BACKUP_INIT_MEM_LIMIT:-64m}
    pids_limit: 32
    read_only: true
    tmpfs: [/tmp]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        chown 65532:10001 /backup && chmod 2770 /backup &&
        mkdir -p /backup/postgres &&
        chown 999:10001 /backup/postgres && chmod 2770 /backup/postgres &&
        mkdir -p /backup/tmp &&
        chown 65532:10001 /backup/tmp && chmod 0700 /backup/tmp
    volumes:
      - crosscodex-backup:/backup

  db:
    env_file: [backup.env]
    volumes:
      - crosscodex-backup:/backup
    depends_on:
      backup-init:
        condition: service_completed_successfully
    # Repeats compose.yaml's command (compose replaces, not merges, it) and
    # adds WAL archiving. archive_timeout bounds data loss on an idle system:
    # a segment ships at least every 60s.
    command: >
      postgres
        -c shared_preload_libraries=age
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c ssl=on
        -c ssl_cert_file=/certs/server.pem
        -c ssl_key_file=/certs/server-key.pem
        -c ssl_ca_file=/certs/ca.pem
        -c wal_level=replica
        -c archive_mode=on
        -c "archive_command=umask 0027 && wal-g wal-push %p"
        -c archive_timeout=60

  crosscodexd:
    environment:
      TMPDIR: /backup/tmp
    volumes:
      - crosscodex-backup:/backup
      - ./backup.config.yaml:/etc/crosscodex/conf.d/50-backup.yaml:ro

  db-restore:
    profiles: [restore]
    image: crosscodex-db:${TAG:-latest}
    user: postgres
    group_add: ["10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${CROSSCODEX_DB_RESTORE_MEM_LIMIT:-1g}
    pids_limit: 128
    env_file: [backup.env]
    entrypoint: ["crosscodex-db-restore"]
    volumes:
      - crosscodex-pgdata:/var/lib/postgresql/data
      - crosscodex-backup:/backup

volumes:
  crosscodex-backup:

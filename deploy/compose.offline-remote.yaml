# Remote-Ollama overlay for the deploy:local and deploy:smoke stacks. Used instead of
# compose.offline.yaml when OLLAMA_HOST points at an existing Ollama rather than
# the baked local container (deploy/local_up.sh selects it). It only
# repoints LiteLLM at the rendered offline config (whose api_base is the external
# host); it defines NO local ollama service and NO depends_on, so LiteLLM starts
# immediately and reaches the external host directly. local_up.sh probes that
# host and pulls its models before bring-up, so an unreachable provider fails
# fast. Production compose.yaml is untouched.
services:
  crosscodexd:
    # local_up.sh sets these to true only for a single-model Ollama (no
    # OLLAMA_PANEL_MODELS), where the panel aliases cannot differ. Otherwise
    # they stay false and the daemon checks the panel's model diversity.
    environment:
      CROSSCODEX_ANALYSIS_RELATIONSHIP_ALLOW_SHARED_PANEL_MODELS: ${CROSSCODEX_ANALYSIS_RELATIONSHIP_ALLOW_SHARED_PANEL_MODELS:-false}
      CROSSCODEX_ANALYSIS_REQUIRES_ALLOW_SHARED_PANEL_MODELS: ${CROSSCODEX_ANALYSIS_REQUIRES_ALLOW_SHARED_PANEL_MODELS:-false}
      CROSSCODEX_ANALYSIS_CRITIQUE_ALLOW_SHARED_PANEL_MODELS: ${CROSSCODEX_ANALYSIS_CRITIQUE_ALLOW_SHARED_PANEL_MODELS:-false}

  litellm:
    # Map host.containers.internal to the host gateway so a loopback OLLAMA_HOST
    # override (an Ollama on the host) is reachable from this bridge-networked
    # container. local_up.sh translates localhost/127.0.0.1 in OLLAMA_HOST to
    # host.containers.internal when rendering api_base; for a LAN/remote host the
    # entry is simply unused. Requires podman >= 4.1 / docker-compose host-gateway.
    extra_hosts:
      - "host.containers.internal:host-gateway"
    # Distinct target avoids a volumes-list merge collision with the base
    # /app/config.yaml mount; the command override selects this file.
    # local_up.sh renders it into CROSSCODEX_GATEWAY_CONFIG_DIR (see
    # compose.offline.yaml).
    volumes:
      - ${CROSSCODEX_GATEWAY_CONFIG_DIR:-../.test-output/deploy-smoke}/litellm_config.yaml:/app/config.offline.yaml:ro
    command:
      [
        "--config",
        "/app/config.offline.yaml",
        "--port",
        "4000",
        "--host",
        "127.0.0.1",
      ]

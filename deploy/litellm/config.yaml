# LiteLLM proxy config for the CrossCodex production stack. Binds plaintext on
# loopback :4000; the stunnel sidecar terminates mTLS on :4443. Point the model
# aliases at any OpenAI-compatible provider via environment substitution.
model_list:
  - model_name: default
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # panel-1..3 serve the relationship, requires and critique panels
  # (analysis.*.models in deploy/config.yaml). The daemon refuses a panel whose
  # aliases resolve to the same model. The three below are current OpenAI API
  # models that serve Chat Completions (checked 2026-11-12 against
  # https://developers.openai.com/api/docs/models/all and each model's page).
  # They are three different models but one provider: they share a vendor's
  # training data and methods, so their errors are less independent than
  # those of models from different families. For real independence, point the
  # aliases at different providers or model families. All three are reasoning
  # models; gpt-6.1-terra and gpt-5.6-terra default to medium reasoning effort
  # (gpt-5.4-mini to none), which spends the short answer budgets (max_tokens
  # in config.yaml) on reasoning: lower their effort to none or raise
  # max_tokens.
  - model_name: panel-1
    litellm_params:
      model: openai/gpt-6.1-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: panel-2
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: panel-3
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  telemetry: false
  master_key: os.environ/CROSSCODEX_LLM_API_KEY

foreground = yes
[litellm]
; Bind the IPv4 wildcard explicitly. A bare "4443" makes stunnel bind both
; 0.0.0.0:4443 and :::4443; the IPv6 bind then fails EADDRINUSE because the
; IPv4 wildcard already covers the port. crosscodexd dials litellm:4443, which
; aardvark-dns resolves to the container's IPv4 address.
accept  = 0.0.0.0:4443
connect = 127.0.0.1:4000
cert    = /certs/server.pem
key     = /certs/server-key.pem
CAfile  = /certs/ca.pem
verify  = 2

# Single-host production stack for CrossCodex (role: all) over full mTLS.
# Populate the cert volume first: task deploy:certs
#
# Cert keys in the shared crosscodex-certs volume are owned root:10001, mode
# 0640 (group-read only). Every service that mounts the volume joins GID 10001
# via group_add so it can read the keys despite running as a different user
# (postgres, nats=root, stunnel=nobody, crosscodexd=nonroot). This GID MUST
# match CERT_GID in .taskfiles/deploy.yml (the deploy:certs task).
#
# Database roles: crosscodexd connects only as the restricted roles app_user
# and graph_user, and refuses to start as a superuser or the schema owner.
# The one-shot `migrate` service runs first as the `crosscodex` owner: it
# applies migrations and sets each restricted role's password from the
# password in that role's DSN below. Only `db` and `migrate` ever receive
# POSTGRES_PASSWORD. The db's pg_hba.conf requires a scram-sha-256 password
# and a valid client cert for every TCP login.

# Restricted-role DSNs shared by `migrate` (which sets the passwords) and
# `crosscodexd` (which logs in with them). The tenant_admin and backup_user
# DSNs are optional; leave them unset in .env to skip those roles.
x-role-dsns: &role-dsns
  CROSSCODEX_DATABASE_DSN: postgres://app_user:${APP_USER_PASSWORD:?APP_USER_PASSWORD required}@db:5432/crosscodex?sslmode=verify-full&sslrootcert=/certs/ca.pem&sslcert=/certs/client.pem&sslkey=/certs/client-key.pem
  CROSSCODEX_DATABASE_GRAPH_DSN: postgres://graph_user:${GRAPH_USER_PASSWORD:?GRAPH_USER_PASSWORD required}@db:5432/crosscodex?sslmode=verify-full&sslrootcert=/certs/ca.pem&sslcert=/certs/client.pem&sslkey=/certs/client-key.pem
  CROSSCODEX_DATABASE_TENANT_ADMIN_DSN: ${CROSSCODEX_DATABASE_TENANT_ADMIN_DSN:-}
  CROSSCODEX_BACKUP_DSN: ${CROSSCODEX_BACKUP_DSN:-}

services:
  db:
    image: crosscodex-db:${TAG:-latest}
    restart: unless-stopped
    group_add: ["10001"]
    environment:
      POSTGRES_USER: crosscodex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: crosscodex
    volumes:
      - crosscodex-certs:/certs
      - crosscodex-pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=age
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c ssl=on
        -c ssl_cert_file=/certs/server.pem
        -c ssl_key_file=/certs/server-key.pem
        -c ssl_ca_file=/certs/ca.pem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U crosscodex -q"]
      interval: 2s
      timeout: 5s
      retries: 30

  nats:
    image: docker.io/nats:2.11.17-alpine
    restart: unless-stopped
    group_add: ["10001"]
    volumes:
      - crosscodex-certs:/certs
      - crosscodex-jetstream:/data
    command: >
      --tls
      --tlscert=/certs/server.pem
      --tlskey=/certs/server-key.pem
      --tlscacert=/certs/ca.pem
      --tlsverify
      --jetstream
      --store_dir=/data
    healthcheck:
      # Probe the actual client listener, not just binary presence: a bare TCP
      # connect succeeds before the TLS handshake, so it confirms nats bound
      # :4222 without needing a client cert. `nats-server --help` would exit 0
      # whenever the binary exists, masking a server that never came up.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4222 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  litellm:
    image: docker.io/litellm/litellm:1.87.1
    restart: unless-stopped
    # Only the keys litellm/config.yaml reads; .env also holds database
    # passwords, which this third-party image must not receive.
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CROSSCODEX_LLM_API_KEY: ${CROSSCODEX_LLM_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--host", "127.0.0.1"]
    healthcheck:
      # Use /health/liveliness, not /health: /health is auth-gated when a
      # master_key is set (returns 401 unauthenticated) and makes live calls to
      # every configured provider. liveliness is unauthenticated, cheap, and
      # confirms the proxy is serving. Probing /health leaves the container
      # permanently unhealthy, stalling litellm-tls and crosscodexd.
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/liveliness'')"',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  litellm-tls:
    image: crosscodex-litellm-tls:${TAG:-latest}
    restart: unless-stopped
    build:
      context: ./litellm
      dockerfile: Containerfile
    group_add: ["10001"]
    network_mode: "service:litellm"
    volumes:
      - crosscodex-certs:/certs:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4443 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    image: crosscodexd:${TAG:-latest}
    restart: "no"
    group_add: ["10001"]
    command: ["migrate"]
    environment:
      <<: *role-dsns
      CROSSCODEX_DATABASE_MIGRATION_DSN: postgres://crosscodex:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/crosscodex?sslmode=verify-full&sslrootcert=/certs/ca.pem&sslcert=/certs/client.pem&sslkey=/certs/client-key.pem
    volumes:
      - crosscodex-certs:/certs:ro
      - ./config.yaml:/etc/crosscodex/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  crosscodexd:
    image: crosscodexd:${TAG:-latest}
    restart: unless-stopped
    group_add: ["10001"]
    # No env_file: the daemon gets only what it reads, never POSTGRES_PASSWORD.
    environment:
      <<: *role-dsns
      CROSSCODEX_LLM_API_KEY: ${CROSSCODEX_LLM_API_KEY:-}
      CROSSCODEX_LLM_DEFAULT_MODEL: ${CROSSCODEX_LLM_DEFAULT_MODEL:-}
      CROSSCODEX_LLM_EMBEDDING_MODEL: ${CROSSCODEX_LLM_EMBEDDING_MODEL:-}
      # S3 backup destination only (the AWS credential chain); empty otherwise.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      # Published host port is overridable so an isolated stack (e.g. the
      # ephemeral smoke stack) can run alongside a production stack on 50051.
      # The in-container port stays 50051.
      - "${CROSSCODEX_GATEWAY_PORT:-50051}:50051"
    volumes:
      - crosscodex-certs:/certs:ro
      - ./config.yaml:/etc/crosscodex/config.yaml:ro
      - crosscodex-objects:/var/lib/crosscodex/objects
    depends_on:
      db:
        condition: service_healthy
      # podman-compose 1.x waits for migrate to stop but does not check its
      # exit code. A failed migrate still keeps the daemon down: it refuses a
      # schema not at the latest version, cannot log in without its role
      # password, and (role all) refuses a missing default tenant.
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      # crosscodexd reaches the LLM only through litellm-tls (stunnel on
      # litellm:4443); litellm-tls being healthy transitively guarantees
      # litellm is up, so gate the daemon on the TLS front, not the backend.
      litellm-tls:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/crosscodexd", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  crosscodex-pgdata:
  crosscodex-objects:
  crosscodex-jetstream:
  crosscodex-certs:
    external: true
    # Overridable so an isolated stack (e.g. the ephemeral smoke stack) mounts
    # its own PKI volume instead of the production one.
    name: ${CROSSCODEX_CERTS_VOLUME:-crosscodex-certs}

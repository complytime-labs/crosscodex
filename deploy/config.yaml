role: all
logging:
  level: info
  format: json
# health.addr is inert in the `all` role (gateway serves /healthz on server.addr).
health:
  addr: ":9091"
server:
  addr: ":50051"
# The DSNs (database.dsn, database.graph_dsn, database.migration_dsn, and the
# optional tenant_admin and backup DSNs) carry passwords, so they come from the
# CROSSCODEX_* variables in compose.yaml's `environment:`, not from this file.
database:
  ssl_mode: verify-full
nats:
  url: "tls://nats:4222"
  tls: true
tls:
  mode: mutual
  ca: /certs/ca.pem
  cert: /certs/client.pem
  key: /certs/client-key.pem
  targets:
    # The gateway HTTPS listener must present the SERVER cert (ServerAuth EKU,
    # SANs covering localhost/127.0.0.1/service names). The global cert above is
    # the daemon's CLIENT identity for its outbound mTLS to db/nats/llm; without
    # this override the listener would serve client.pem (ClientAuth-only, SAN
    # DNS:client), which every client rejects during verification.
    gateway-server:
      cert: /certs/server.pem
      key: /certs/server-key.pem
    llm:
      mode: mutual
      ca: /certs/ca.pem
      cert: /certs/client.pem
      key: /certs/client-key.pem
    nats:
      mode: mutual
      ca: /certs/ca.pem
      cert: /certs/client.pem
      key: /certs/client-key.pem
storage:
  objects:
    backend: local
    base_path: /var/lib/crosscodex/objects
# in-toto attestation signing keypair (ECDSA P-256), provisioned into the
# shared cert volume by `task deploy:certs` alongside the TLS PKI. Required by
# the pipeline, which role `all` builds in-process; `enabled` and
# `expiry_duration` inherit the config defaults.
attestation:
  private_key_path: /certs/attestation-key.pem
  public_key_path: /certs/attestation-pub.pem
tenants:
  enabled: false
  default_tenant: default
llm:
  # LLM_GATEWAY=praxis overrides this via CROSSCODEX_LLM_GATEWAY_URL
  # (compose.gateway-praxis.yaml).
  gateway_url: "https://litellm:4443"
  gateway_mode: true
  # default_model and embedding_model are populated by the CROSSCODEX_LLM_*
  # env overlay (deploy/.env: CROSSCODEX_LLM_DEFAULT_MODEL /
  # CROSSCODEX_LLM_EMBEDDING_MODEL). The loader does not interpolate ${...} in
  # YAML values, so these are set through the environment, not written here.
  #
  # llm.embedding_model reaches the worker only as a fallback for tasks with no
  # model set (internal/worker/handler.go). The embedding analyzer always stamps
  # each task with a model drawn from analysis.embedding.models below, so that
  # fallback never fires for embeddings -- the embedding model MUST be set under
  # analysis, not here. llm.default_model does drive classification (its tasks
  # carry no model), so CROSSCODEX_LLM_DEFAULT_MODEL still selects the LiteLLM
  # completion alias.
  api_key_ref: "env:CROSSCODEX_LLM_API_KEY"
analysis:
  # The compiled defaults target the Ollama-backed test stack, whose embedding
  # model is `snowflake-arctic-embed2`. This production stack routes embeddings
  # through LiteLLM, which only exposes the `embed` alias
  # (deploy/litellm/config.yaml), so the model the embedding analyzer requests
  # and the model candidate generation reads embeddings back by must both be
  # `embed`. Without these overrides every embed task 400s at LiteLLM
  # ("Invalid model name ... snowflake-arctic-embed2"), embedding coverage stays
  # at 0%, and candidate generation fails the whole ingest job.
  embedding:
    models:
      - embed
  candidates:
    embed_model: embed
    # Candidate generation pairs each source control with its most similar
    # target controls; the pair analyzers below compare only those pairs.
    # Without an enabled generator they would compare nothing, so the config
    # would not load.
    generators:
      - name: semantic
        enabled: true
        weight: 1.0
  # Mapping is on: relationship produces a job's mappings and requires its
  # REQUIRES edges. Both use a three-model panel: the gateway aliases
  # panel-1..3 (deploy/litellm/config.yaml, deploy/praxis/config.yaml), which
  # must resolve to three different model families; the daemon refuses a panel
  # whose aliases resolve to the same model. If you rename them there, rename
  # them here too. Classification keeps the `default` alias
  # (CROSSCODEX_LLM_DEFAULT_MODEL). Pair calls <= source controls x
  # max_per_source (10) x panel size (models x samples_per_model), summed over
  # both analyzers; see "Cost" in the top-level README. Disable either with
  # `enabled: false`.
  relationship:
    enabled: true
    models:
      - panel-1
      - panel-2
      - panel-3
    # One sample per model: the three different models supply the agreement
    # that makes each mapping's confidence meaningful.
    samples_per_model: 1
  requires:
    enabled: true
    models:
      - panel-1
      - panel-2
      - panel-3
    # One sample per model, so a REQUIRES edge needs a majority
    # (consensus_threshold) of the three models' independent votes.
    samples_per_model: 1
  # Critique re-judges each mapping the relationship and requires panels
  # produced, with the same three models, and drops a pair the panel rejects
  # (consensus_threshold, default 0.66). Cost: one extra LLM call per model
  # (here 3) for every surviving pair, so it adds roughly the call volume of
  # one more pair analyzer; a failed critique call keeps the pair and notes
  # it. To skip the extra calls and the delay, set `enabled: false`.
  critique:
    enabled: true
    models:
      - panel-1
      - panel-2
      - panel-3
    samples_per_model: 1
worker:
  # Tasks this crosscodexd runs at once (default 1: one LLM call at a time,
  # across every job). Match it to the model server's parallel slots
  # (llama.cpp --parallel, vLLM --max-num-seqs) or the hosted API's
  # concurrency limit. It shortens a job's wall time, not its LLM calls (see
  # "What an analysis runs, and what it costs" in deploy/README.md). Requests
  # beyond the server's slots queue there, so llm.timeout must cover that wait
  # as well as the reply. Range [1, 256].
  max_in_flight: 1

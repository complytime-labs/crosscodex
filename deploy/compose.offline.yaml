# Offline overlay for the deploy:local and deploy:smoke stacks. Applied on top
# of compose.yaml only by deploy/local_up.sh (which exports COMPOSE_OVERLAY);
# the production `task deploy:up` never loads it, so production stays OpenAI-backed.
#
# It adds a local Ollama provider (baked-model image reused from the integration
# stack) and repoints the LiteLLM service at it, so the smoke test runs
# self-contained with no external API key. LiteLLM still terminates mTLS via the
# unchanged litellm-tls stunnel sidecar; only its upstream target changes.
services:
  ollama:
    # Baked-model image from the integration stack (llama3.2:1b +
    # granite-embedding:30m), built from test/ollama/Containerfile by
    # local_up.sh for the local (default) path.
    image: crosscodex-test-ollama:latest
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # llama3.2:1b plus the embedding model, loaded together.
    mem_limit: ${CROSSCODEX_OLLAMA_MEM_LIMIT:-4g}
    pids_limit: 512
    # Models are baked into the image; Ollama only logs a warning that it
    # cannot persist its model-recommendations cache under /root/.ollama.
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  crosscodexd:
    # The offline model server is one model, so the panel aliases cannot resolve
    # to different model families; allow the daemon to run them anyway. The
    # production stack (compose.yaml alone) leaves these false.
    environment:
      CROSSCODEX_ANALYSIS_RELATIONSHIP_ALLOW_SHARED_PANEL_MODELS: "true"
      CROSSCODEX_ANALYSIS_REQUIRES_ALLOW_SHARED_PANEL_MODELS: "true"
      CROSSCODEX_ANALYSIS_CRITIQUE_ALLOW_SHARED_PANEL_MODELS: "true"

  litellm:
    # Gate LiteLLM on Ollama so the first inference call cannot race a
    # still-loading model. depends_on merges with the base service (which has none).
    depends_on:
      ollama:
        condition: service_healthy
    # Mount the rendered offline config at a DISTINCT target: overlay volume
    # lists concatenate, so reusing /app/config.yaml would collide with the base
    # mount. The command override (replaced, not merged) selects this file.
    # local_up.sh renders the file into CROSSCODEX_GATEWAY_CONFIG_DIR (its
    # OUT_DIR). The default, relative to this compose file's dir (deploy/), is
    # the smoke stack's, so a hand-run compose against it still resolves.
    volumes:
      - ${CROSSCODEX_GATEWAY_CONFIG_DIR:-../.test-output/deploy-smoke}/litellm_config.yaml:/app/config.offline.yaml:ro
    command:
      [
        "--config",
        "/app/config.offline.yaml",
        "--port",
        "4000",
        "--host",
        "127.0.0.1",
      ]

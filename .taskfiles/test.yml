version: "3"

includes:
  integration:
    taskfile: test/integration.yml
    dir: "{{.ROOT_DIR}}"
  traces:
    taskfile: test/traces.yml
    dir: "{{.ROOT_DIR}}"
  stress:
    taskfile: test/stress.yml
    dir: "{{.ROOT_DIR}}"
  e2e:
    taskfile: test/e2e.yml
    dir: "{{.ROOT_DIR}}"

vars:
  MODULE: '{{.MODULE | default "github.com/complytime-labs/crosscodex"}}'
  TEST_DIR: '{{.TEST_DIR | default (printf "%s/.test-output" .ROOT_DIR)}}'

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  unit:
    desc: Run unit tests with spec tree output
    deps:
      - :dev:deps
      - :dev:generate
    env:
      TEST_TRACE_DIR: "{{.TEST_DIR}}/traces"
    cmds:
      - mkdir -p {{.TEST_DIR}}
      # testgrpc contains only integration_grpc-tagged tests requiring a live
      # gRPC server — skip it during unit runs; use task test:integration:grpc.
      # --keep-going runs every suite after a failure, so one run reports all
      # failing packages. --output-dir keeps Ginkgo's per-suite reports in
      # TEST_DIR: without it Ginkgo joins the absolute report path onto each
      # package directory and leaves an empty <pkg>/workspace/... tree behind.
      # ginkgoleaf runs even when ginkgo fails, and the step exits non-zero
      # if either step fails.
      - |
        status=0
        go run github.com/onsi/ginkgo/v2/ginkgo run --procs {{.GOMEGA_PROCS}} -r --keep-going --randomize-all --fail-on-pending --skip-package testgrpc --output-dir {{.TEST_DIR}} --json-report=ginkgo-report.json ./pkg/... ./internal/... ./cmd/... || status=$?
        go run github.com/trevor-vaughan/ginkgoleaf/cmd/ginkgoleaf@v0.1.0 -in {{.TEST_DIR}}/ginkgo-report.json -format {{.GINKGOLEAF_FORMAT}} -exit-code || status=$?
        exit $status

  race:
    desc: Run pkg/graphdb unit tests with the race detector
    deps:
      - :dev:deps
      - :dev:generate
    cmds:
      - mkdir -p {{.TEST_DIR}}
      # memdriver is shared by concurrent NATS subscriber tests; its locking
      # is only proven under the race detector.
      # See test:unit for --keep-going, --output-dir and the status handling.
      - |
        status=0
        go run github.com/onsi/ginkgo/v2/ginkgo run --procs {{.GOMEGA_PROCS}} -r --keep-going --race --randomize-all --fail-on-pending --output-dir {{.TEST_DIR}} --json-report=race-report.json ./pkg/graphdb/... || status=$?
        go run github.com/trevor-vaughan/ginkgoleaf/cmd/ginkgoleaf@v0.1.0 -in {{.TEST_DIR}}/race-report.json -format {{.GINKGOLEAF_FORMAT}} -exit-code || status=$?
        exit $status

  fuzz:
    desc: Run fuzz tests across all packages
    vars:
      FUZZ_TIME: '{{.FUZZ_TIME | default "10s"}}'
      FUZZ_TIMEOUT: '{{.FUZZ_TIMEOUT | default "2m"}}'
    cmds:
      - mkdir -p {{.TEST_DIR}}
      # Go before 1.27 can fail a target with "context deadline exceeded" right
      # at -fuzztime even though nothing crashed (golang/go#75804: a race in
      # the fuzz coordinator, fixed in go1.27). No crash input is written; rerun
      # the target. The bump to go1.27 is deferred until Red Hat ships a Go 1.27
      # toolchain, because FIPS=1 builds use Red Hat Go's OpenSSL FIPS module.
      - |
        failed=0
        for pkg in $(go list ./pkg/... ./internal/...); do
          fuzz_funcs=$(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
          for func in $fuzz_funcs; do
            echo "==> Fuzzing $func in $pkg ({{.FUZZ_TIME}})"
            if ! go test "$pkg" -run '^$' -fuzz "^${func}$" -fuzztime={{.FUZZ_TIME}} -timeout={{.FUZZ_TIMEOUT}}; then
              failed=1
            fi
          done
        done
        exit $failed

  property:
    desc: Run property-based tests only
    deps:
      - :dev:deps
      - :dev:generate
    cmds:
      - mkdir -p {{.TEST_DIR}}
      # testgrpc: integration-only, no property specs — see task test:integration:grpc
      # See test:unit for --keep-going, --output-dir and the status handling.
      - |
        status=0
        go run github.com/onsi/ginkgo/v2/ginkgo run --procs {{.GOMEGA_PROCS}} -r --keep-going --focus "Property Specifications" --skip-package testgrpc --output-dir {{.TEST_DIR}} --json-report=property-report.json ./pkg/... ./internal/... || status=$?
        go run github.com/trevor-vaughan/ginkgoleaf/cmd/ginkgoleaf@v0.1.0 -in {{.TEST_DIR}}/property-report.json -format {{.GINKGOLEAF_FORMAT}} -exit-code || status=$?
        exit $status

version: "3"

vars:
  MODULE: '{{.MODULE | default "github.com/complytime-labs/crosscodex"}}'
  CONTAINER_ENGINE: '{{.CONTAINER_ENGINE | default "podman"}}'
  REGISTRY: '{{.REGISTRY | default "ghcr.io/complytime-labs"}}'
  TAG: '{{.TAG | default "latest"}}'
  VERSION: '{{.VERSION | default "dev"}}'
  GIT_COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo unknown
  BUILD_DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  COMPOSE_CMD:
    sh: |
      # Derive compose command from CONTAINER_ENGINE to avoid cross-engine
      # volume/container mismatches (e.g. podman volumes invisible to docker).
      engine="{{.CONTAINER_ENGINE}}"
      case "$engine" in
        podman)
          # Prefer standalone podman-compose (pip) over "podman compose" plugin.
          # On GitHub Actions, "podman compose version" succeeds by discovering
          # /usr/libexec/docker/cli-plugins/docker-compose, which then fails at
          # runtime because it needs a Docker daemon socket.  The pip-installed
          # podman-compose speaks to podman natively and always works.
          if command -v podman-compose >/dev/null 2>&1; then
            echo "podman-compose"
          elif podman compose version >/dev/null 2>&1; then
            echo "podman compose"
          else
            echo "MISSING"
          fi
          ;;
        docker)
          if docker compose version >/dev/null 2>&1; then
            echo "docker compose"
          else
            echo "MISSING"
          fi
          ;;
        *)
          echo "MISSING"
          ;;
      esac
  # LLM gateway between crosscodexd and the model provider: litellm (default;
  # LiteLLM behind a stunnel mTLS sidecar) or praxis (Praxis AI terminating
  # mTLS itself; spike, see deploy/README.md). Selects the compose fragment
  # deploy:up and deploy:logs load on top of compose.yaml.
  # Praxis only: PRAXIS_MODELS_ENDPOINT serves GET /v1/models (false by
  # default; true starts Praxis on deploy/praxis/config.models.yaml, which sets
  # a pipeline-check override; see its header). No effect with litellm, which
  # always serves the endpoint.
  #
  # Both resolve as: a CLI var, then the process env, then an LLM_GATEWAY= /
  # PRAXIS_MODELS_ENDPOINT= line in deploy/.env (so a later plain
  # `task deploy:up` keeps the deployed gateway), then the default. Only those
  # two keys are read from deploy/.env; `dotenv:` would load every secret in
  # it into the task env.
  #
  # The resolved values live in DEPLOY_*, not in vars named LLM_GATEWAY /
  # PRAXIS_MODELS_ENDPOINT, because go-task merges the global vars of every
  # included Taskfile into one namespace and evaluates them twice (the second
  # pass sees the first pass's result). A global of either name, here or in
  # any other included Taskfile, would therefore hide the deploy/.env value
  # and the raw CLI/env value the smoke path needs. Tasks alias DEPLOY_* back
  # to the knob names in their own vars so requires.enum reports the name the
  # operator sets, including for a bad value in deploy/.env.
  LLM_GATEWAY_DOTENV:
    sh: |
      f="{{.ROOT_DIR}}/deploy/.env"
      if [ -f "$f" ]; then sed -nE 's/^(export[[:space:]]+)?LLM_GATEWAY=//p' "$f" | tail -n 1; fi
  PRAXIS_MODELS_ENDPOINT_DOTENV:
    sh: |
      f="{{.ROOT_DIR}}/deploy/.env"
      if [ -f "$f" ]; then sed -nE 's/^(export[[:space:]]+)?PRAXIS_MODELS_ENDPOINT=//p' "$f" | tail -n 1; fi
  DEPLOY_LLM_GATEWAY: '{{.LLM_GATEWAY | default .LLM_GATEWAY_DOTENV | default "litellm"}}'
  DEPLOY_PRAXIS_MODELS_ENDPOINT: '{{.PRAXIS_MODELS_ENDPOINT | default .PRAXIS_MODELS_ENDPOINT_DOTENV | default "false"}}'
  COMPOSE_FILES: '-f {{.ROOT_DIR}}/deploy/compose.yaml -f {{.ROOT_DIR}}/deploy/compose.gateway-{{.DEPLOY_LLM_GATEWAY}}.yaml{{if and (eq .DEPLOY_LLM_GATEWAY "praxis") (eq .DEPLOY_PRAXIS_MODELS_ENDPOINT "true")}} -f {{.ROOT_DIR}}/deploy/compose.gateway-praxis-models.yaml{{end}}'
  # Deploy identity knobs. Override via environment for an isolated stack (the
  # ephemeral smoke stack sets all five plus COMPOSE_PROJECT_NAME); the
  # defaults reproduce the production stack. The three volumes and GATEWAY_PORT are
  # also read by compose.yaml's ${...} interpolation, so exporting them keeps
  # the task side and the compose side in agreement.
  CERTS_DIR: '{{.CERTS_DIR | default (printf "%s/deploy/certs" .ROOT_DIR)}}'
  # Prefix of the per-service server cert volumes: <CERTS_VOLUME>-<service>
  # for each service in CERT_SERVICES (issue #298).
  CERTS_VOLUME: '{{.CROSSCODEX_CERTS_VOLUME | default "crosscodex-certs"}}'
  # The TLS servers, one key and certificate each. Must match `services` in
  # deploy/certgen/gen.go and the per-service volumes in deploy/compose*.yaml.
  CERT_SERVICES: db nats litellm praxis crosscodexd ingestion
  # Key volumes split by consumer (issues #236, #298): one server volume per
  # service in CERT_SERVICES holding only that service's key; CLIENT_CERTS_VOLUME
  # the daemon's client identity (migrate and crosscodexd); ATTESTATION_KEYS_VOLUME
  # the attestation signing keypair (crosscodexd only).
  CLIENT_CERTS_VOLUME: '{{.CROSSCODEX_CLIENT_CERTS_VOLUME | default "crosscodex-client-certs"}}'
  ATTESTATION_KEYS_VOLUME: '{{.CROSSCODEX_ATTESTATION_KEYS_VOLUME | default "crosscodex-attestation-keys"}}'
  GATEWAY_PORT: '{{.CROSSCODEX_GATEWAY_PORT | default "50051"}}'
  # Isolation identity for the ephemeral smoke stack. Single source of truth
  # shared by smoke:up and smoke:down so both act on the same project, volumes,
  # port, and throwaway PKI dir. Exported (via each task's env:) as the
  # COMPOSE_PROJECT_NAME / CROSSCODEX_* / CERTS_DIR that deploy/compose.yaml and
  # the deploy:* tasks read. SMOKE_GATEWAY_PORT and SMOKE_CERTS_DIR are defined
  # in the root Taskfile.yml because eval.yml reads them too.
  SMOKE_PROJECT: '{{.SMOKE_PROJECT | default "crosscodex-smoke"}}'
  # The smoke stack's gateway: the CLI var or env, else litellm. Deliberately
  # ignores deploy/.env, so an operator's persisted praxis choice does not
  # change what `task deploy:smoke` tests. The smoke tasks alias it to
  # LLM_GATEWAY and export it, and the process env beats deploy/.env in the
  # child `task deploy:up` that smoke_up.sh runs.
  SMOKE_LLM_GATEWAY: '{{.LLM_GATEWAY | default "litellm"}}'
  SMOKE_CERTS_VOLUME: '{{.SMOKE_CERTS_VOLUME | default "crosscodex-smoke-certs"}}'
  SMOKE_CLIENT_CERTS_VOLUME: '{{.SMOKE_CLIENT_CERTS_VOLUME | default "crosscodex-smoke-client-certs"}}'
  SMOKE_ATTESTATION_KEYS_VOLUME: '{{.SMOKE_ATTESTATION_KEYS_VOLUME | default "crosscodex-smoke-attestation-keys"}}'
  # Host-loopback port compose.offline-praxis.yaml publishes praxis's mTLS
  # listener on, for smoke_up.sh's direct gateway probes (LLM_GATEWAY=praxis).
  SMOKE_PRAXIS_PORT: '{{.SMOKE_PRAXIS_PORT | default "54443"}}'
  # Isolation identity for the persistent deploy:local stack, shared by local
  # and local:down: its own project (which also namespaces its data volumes),
  # key volumes, gateway port and PKI dir, so neither the production stack nor
  # deploy:smoke (whose teardown drops its volumes) can touch it. LOCAL_DIR
  # (gitignored) holds the PKI (pki/, CA key included), the rendered gateway
  # config and the CLI (bin/crosscodex).
  LOCAL_PROJECT: crosscodex-local
  LOCAL_CERTS_VOLUME: crosscodex-local-certs
  LOCAL_CLIENT_CERTS_VOLUME: crosscodex-local-client-certs
  LOCAL_ATTESTATION_KEYS_VOLUME: crosscodex-local-attestation-keys
  LOCAL_GATEWAY_PORT: "50251"
  LOCAL_DIR: "{{.ROOT_DIR}}/.local/crosscodex"
  LOCAL_CERTS_DIR: "{{.ROOT_DIR}}/.local/crosscodex/pki"
  # The local stack's gateway: the CLI var or env, else litellm; like
  # SMOKE_LLM_GATEWAY it ignores deploy/.env. local accepts only litellm (the
  # Praxis offline overlay needs a probe port the local identity does not
  # have), so an explicit LLM_GATEWAY=praxis is refused rather than ignored.
  LOCAL_LLM_GATEWAY: '{{.LLM_GATEWAY | default "litellm"}}'
  # Document ingestion for the local stack (INGESTION, the CLI var or env; it
  # ignores deploy/.env like LOCAL_LLM_GATEWAY): 0 (default) runs none, 1 adds
  # compose.ingestion.yaml (the crosscodex-ingestion service writing to the
  # shared crosscodex-objects volume), rustfs adds compose.rustfs.yaml on top
  # (both services on a RustFS S3 bucket). local and local:down validate the
  # value; LOCAL_INGESTION_OVERLAYS is the overlay list local hands to
  # deploy:up through COMPOSE_OVERLAY (local:down builds its own list). Only
  # the local stack takes it:
  # the ingestion overlay is not hardened for production (deploy/README.md).
  LOCAL_INGESTION: '{{.INGESTION | default "0"}}'
  LOCAL_INGESTION_OVERLAYS: '{{if or (eq .LOCAL_INGESTION "1") (eq .LOCAL_INGESTION "rustfs")}}{{.ROOT_DIR}}/deploy/compose.ingestion.yaml{{end}}{{if eq .LOCAL_INGESTION "rustfs"}} {{.ROOT_DIR}}/deploy/compose.rustfs.yaml{{end}}'
  # Opt-in fast build path. LOCAL=1 builds the Go binaries on the host and copies
  # them into thin distroless images (deploy/Dockerfile.local), skipping the
  # hermetic in-container Go build. Requires a local Go toolchain and trades
  # CI-identical reproducibility for speed; unset (the default) keeps the
  # hermetic multi-stage build. Read by the build task and propagated to it as a
  # global var through every deploy:* task that depends on build.
  LOCAL: '{{.LOCAL | default ""}}'
  # Generic compose-overlay knob so an isolated stack can layer an overlay onto
  # compose.yaml plus the gateway fragment (COMPOSE_FILES) without deploy:up/down
  # knowing anything smoke-specific. Empty (the default) reproduces the
  # production stack exactly. The smoke path exports COMPOSE_OVERLAY:
  # compose.offline.yaml (LiteLLM) or compose.offline-praxis.yaml (Praxis) for a
  # local baked Ollama, or compose.offline-remote.yaml (LiteLLM only) for a
  # remote OLLAMA_HOST or an OPENAI_COMPAT_HOST. go-task reads exported env vars as vars, so
  # smoke_up.sh's child `task deploy:up` picks this up. It is a space-separated
  # list, loaded in order: deploy:local appends the ingestion overlays
  # (LOCAL_INGESTION_OVERLAYS) to the offline one.
  COMPOSE_OVERLAY: '{{.COMPOSE_OVERLAY | default ""}}'

tasks:
  build:
    desc: Build the crosscodexd, crosscodex-cli, and DB images (LOCAL=1 for the fast host-build path)
    cmds:
      # App images: hermetic in-container build (default) or copy host-built
      # static binaries (LOCAL=1). The DB image is always built the same way.
      - task: '{{if eq .LOCAL "1"}}build:app:local{{else}}build:app:hermetic{{end}}'
      - task: build:db

  build:app:hermetic:
    internal: true
    desc: Build the app images with the hermetic multi-stage Dockerfile (default)
    cmds:
      - >
        {{.CONTAINER_ENGINE}} build
        --target crosscodexd
        --build-arg VERSION={{.VERSION}}
        --build-arg GIT_COMMIT={{.GIT_COMMIT}}
        --build-arg BUILD_DATE={{.BUILD_DATE}}
        --build-arg MODULE={{.MODULE}}
        -t crosscodexd:{{.TAG}}
        -f {{.ROOT_DIR}}/deploy/Dockerfile {{.ROOT_DIR}}
      - >
        {{.CONTAINER_ENGINE}} build
        --target crosscodex-cli
        --build-arg VERSION={{.VERSION}}
        --build-arg GIT_COMMIT={{.GIT_COMMIT}}
        --build-arg BUILD_DATE={{.BUILD_DATE}}
        --build-arg MODULE={{.MODULE}}
        -t crosscodex-cli:{{.TAG}}
        -f {{.ROOT_DIR}}/deploy/Dockerfile {{.ROOT_DIR}}

  build:app:local:
    internal: true
    desc: Build the app images from host-built static binaries (fast dev path)
    vars:
      BUILD_DIR: '{{.BUILD_DIR | default (printf "%s/bin" .ROOT_DIR)}}'
      # Target the container arch, not necessarily the host's (e.g. building an
      # amd64 image on an arm64 host). GOOS is fixed to linux below.
      GOARCH:
        sh: go env GOHOSTARCH
    cmds:
      # Static, linux-targeted binaries so they run in distroless/static.
      # CGO_ENABLED=0 mirrors the hermetic Dockerfile; dev:build supplies the
      # version ldflags. Then copy each into its thin runtime image, using bin/
      # as the (tiny) build context.
      - CGO_ENABLED=0 GOOS=linux GOARCH={{.GOARCH}} task dev:build
      - cp {{.ROOT_DIR}}/deploy/db/fetch-walg.sh {{.BUILD_DIR}}/fetch-walg.sh
      - >
        {{.CONTAINER_ENGINE}} build
        --target crosscodexd
        -t crosscodexd:{{.TAG}}
        -f {{.ROOT_DIR}}/deploy/Dockerfile.local {{.BUILD_DIR}}
      - >
        {{.CONTAINER_ENGINE}} build
        --target crosscodex-cli
        -t crosscodex-cli:{{.TAG}}
        -f {{.ROOT_DIR}}/deploy/Dockerfile.local {{.BUILD_DIR}}

  build:db:
    internal: true
    desc: Build the PostgreSQL+AGE database image
    cmds:
      - >
        {{.CONTAINER_ENGINE}} build
        -t crosscodex-db:{{.TAG}}
        -f {{.ROOT_DIR}}/deploy/db/Containerfile {{.ROOT_DIR}}/deploy/db

  certs:
    desc: Generate the deploy TLS PKI and load it into the per-service server cert volumes (crosscodex-certs-<service>), crosscodex-client-certs and crosscodex-attestation-keys
    cmds:
      - task: certs:generate
      - task: certs:load

  certs:generate:
    internal: true
    desc: Generate the host-side TLS PKI + attestation keys (skipped when the on-disk material is valid)
    cmds:
      # Locks, re-verifies, and atomically replaces CERTS_DIR only if needed,
      # so runs racing past the status check below don't both regenerate.
      - go run {{.ROOT_DIR}}/deploy/certgen/gen.go {{.CERTS_DIR}}
    status:
      # Regenerate when anything is missing, mismatched, lacks a compose SAN
      # (e.g. sets predating praxis), or expires within a day. A full regen
      # mints a new CA, client cert and attestation key, changing the
      # fingerprint and forcing certs:load to reload every volume. A set in
      # the shared-server-key layout of earlier releases fails the same way,
      # so an upgrade regenerates automatically (docs: deploy/README.md,
      # "Upgrading").
      - go run {{.ROOT_DIR}}/deploy/certgen/gen.go --verify {{.CERTS_DIR}}

  certs:load:
    internal: true
    desc: Load the host TLS PKI and attestation keypair into the per-service server, client and attestation key volumes
    # Depends on the db image (used as the copy helper) and the host certs.
    deps: [build, certs:generate]
    cmds:
      # Separate volumes so a service can read only the keys it uses (issues
      # #236, #298). Each service in CERT_SERVICES gets <CERTS_VOLUME>-<service>
      # with ca.pem and its own certificate and key, renamed server.pem and
      # server-key.pem so every service reads the same in-container paths.
      # All of them are loaded whichever LLM gateway runs, so switching gateway
      # needs no reload. CLIENT_CERTS_VOLUME (migrate and crosscodexd at
      # /certs) gets the daemon's client identity, which db and nats trust.
      # ATTESTATION_KEYS_VOLUME (crosscodexd at /attestation) gets the
      # attestation signing keypair. ca-key.pem goes into none: no service signs
      # certificates, and any reader could mint client certificates the whole
      # stack trusts. FILES lists what the volume ends up holding, sorted in C
      # order because the status check compares it with `ls`. PAIRS lists the
      # source:destination copies.
      - for: {var: CERT_SERVICES, split: " "}
        task: certs:load:volume
        vars:
          VOLUME: "{{.CERTS_VOLUME}}-{{.ITEM}}"
          PAIRS: "ca.pem:ca.pem {{.ITEM}}.pem:server.pem {{.ITEM}}-key.pem:server-key.pem"
          FILES: ca.pem server-key.pem server.pem
      - task: certs:load:volume
        vars:
          VOLUME: "{{.CLIENT_CERTS_VOLUME}}"
          PAIRS: ca.pem:ca.pem client.pem:client.pem client-key.pem:client-key.pem
          FILES: ca.pem client-key.pem client.pem
      - task: certs:load:volume
        vars:
          VOLUME: "{{.ATTESTATION_KEYS_VOLUME}}"
          PAIRS: attestation-key.pem:attestation-key.pem attestation-pub.pem:attestation-pub.pem
          FILES: attestation-key.pem attestation-pub.pem

  certs:load:volume:
    internal: true
    desc: Make one certs volume hold exactly FILES, copied from the host PKI as PAIRS (VOLUME, PAIRS, FILES)
    requires:
      vars: [VOLUME, PAIRS, FILES]
    vars:
      # Shared supplementary GID for cert-key access. MUST match the
      # group_add value on every cert-consuming service in deploy/compose.yaml.
      CERT_GID: "10001"
    cmds:
      - "{{.CONTAINER_ENGINE}} volume create {{.VOLUME}} 2>/dev/null || true"
      # Empty the volume, copy PAIRS (source:destination, source names in the
      # host PKI dir), and set a shared-group ownership model so every
      # consumer can read the keys despite running as different users
      # (postgres, nats=root, stunnel=nobody, crosscodexd=nonroot). Files are
      # owned root:CERT_GID; certs 0644, private keys 0640 (group-read only).
      # PostgreSQL accepts a root-owned 0640 key, and each service is added to
      # CERT_GID via group_add in compose.yaml so it can read the key group.
      # Emptying first removes whatever an older release loaded and FILES does
      # not list (ca-key.pem, the client and attestation keys an older
      # release put in the server volume, another service's key); the status
      # check forces that reload. .fingerprint
      # is removed first and copied last, so it marks a complete load.
      # Reuse the db image (has a shell) as the copy helper.
      # Caps (issue #236), measured with this command: CHOWN for the chown to
      # group CERT_GID. DAC_READ_SEARCH because certgen writes its keys 0600
      # (and its dir 0700) as the operator: under rootless podman that uid is
      # container root, but under a rootful engine run by a non-root operator
      # it is a foreign uid that root without the cap cannot read.
      - |
        {{.CONTAINER_ENGINE}} run --rm --user root \
          --cap-drop ALL --cap-add CHOWN --cap-add DAC_READ_SEARCH \
          --security-opt no-new-privileges:true \
          -v {{.VOLUME}}:/certs \
          -v {{.CERTS_DIR}}:/src:ro,z \
          --entrypoint sh \
          crosscodex-db:{{.TAG}} \
          -c 'rm -f /certs/.fingerprint && find /certs -mindepth 1 -delete && for p in {{.PAIRS}}; do cp "/src/${p%%:*}" "/certs/${p#*:}" || exit 1; done && chown 0:{{.CERT_GID}} /certs/* && chmod 0644 /certs/*.pem && chmod 0640 /certs/*-key.pem && cp /src/.fingerprint /certs/'
    # Re-load whenever the volume is absent, its fingerprint no longer matches
    # the host PKI, it holds anything besides FILES and .fingerprint, or any
    # file's content differs from its source in the host PKI dir. The content
    # digests catch what the listing cannot: another service's key under this
    # volume's own file names. `deploy:down VOLUMES=1` explicitly removes every
    # key volume (an external volume survives compose's own `down --volumes`),
    # so after a teardown the read below returns nothing, the check fails, and
    # the volume is repopulated on the next `up`. Both digest lists follow
    # PAIRS order; a missing file makes sha256sum print an error, which
    # differs from the host digests and so forces a reload.
    status:
      - |
        want="$(cd {{.CERTS_DIR}} && for p in {{.PAIRS}}; do sha256sum "${p%%:*}"; done | cut -d' ' -f1 | tr '\n' ' ')"
        got="$({{.CONTAINER_ENGINE}} run --rm -v {{.VOLUME}}:/certs:ro,z --entrypoint sh crosscodex-db:{{.TAG}} -c 'cd /certs && LC_ALL=C ls -A | tr "\n" " " && printf "%s " "$(cat .fingerprint 2>/dev/null)" && for p in {{.PAIRS}}; do sha256sum "${p#*:}" 2>&1; done | cut -d" " -f1 | tr "\n" " "')"
        test "${got}" = ".fingerprint {{.FILES}} $(cat {{.CERTS_DIR}}/.fingerprint) ${want}"

  up:
    desc: Bring up the production stack and wait for the gateway to be healthy
    vars:
      LLM_GATEWAY: "{{.DEPLOY_LLM_GATEWAY}}"
      PRAXIS_MODELS_ENDPOINT: "{{.DEPLOY_PRAXIS_MODELS_ENDPOINT}}"
      # Fail closed on compose tools that ignore volume subpath; the check and
      # its rationale live in scripts/check-praxis-compose.sh. This is a
      # dynamic var, not a precondition, because go-task evaluates task vars
      # before deps (build, certs) but runs preconditions after them, and
      # requires cannot run a shell check. Its output is unused; a non-zero
      # exit aborts the task. It runs before requires validates the gateway
      # value, so the template runs the script only for the exact value praxis
      # and the unvalidated value never reaches a shell; any other value
      # falls through to requires.enum. COMPOSE_CMD is safe to pass: it is
      # one of a fixed set of strings chosen by the COMPOSE_CMD var above.
      PRAXIS_SUBPATH_GUARD:
        sh: '{{if eq .LLM_GATEWAY "praxis"}}bash "{{.ROOT_DIR}}/scripts/check-praxis-compose.sh" "{{.COMPOSE_CMD}}"{{else}}true{{end}}'
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm, praxis]
        - name: PRAXIS_MODELS_ENDPOINT
          enum: ["false", "true"]
    deps: [build, certs]
    dir: "{{.ROOT_DIR}}/deploy"
    # Export the identity knobs so the compose subprocess resolves the same
    # volume name and published port that the task side uses (compose.yaml reads
    # these via ${...}). COMPOSE_PROJECT_NAME is inherited from the caller's
    # environment when set (the smoke stack exports it), otherwise compose
    # derives the default project from the compose directory.
    env:
      CROSSCODEX_CERTS_VOLUME: "{{.CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.GATEWAY_PORT}}"
    preconditions:
      - sh: "test -f {{.ROOT_DIR}}/deploy/.env"
        msg: "deploy/.env missing. Copy deploy/.env.example to deploy/.env and fill it in."
      # Fail before starting the stack if a required key is absent or empty,
      # rather than at first DB connect / LLM call. The three database
      # passwords are also enforced by compose (${...:?}); checked here too so
      # all required keys fail the same way, up front.
      - sh: |
          missing=""
          for k in POSTGRES_PASSWORD APP_USER_PASSWORD GRAPH_USER_PASSWORD OPENAI_API_KEY CROSSCODEX_LLM_API_KEY CROSSCODEX_LLM_DEFAULT_MODEL CROSSCODEX_LLM_EMBEDDING_MODEL; do
            grep -qE "^${k}=.+" {{.ROOT_DIR}}/deploy/.env || missing="${missing} ${k}"
          done
          test -z "${missing}" || { echo "deploy/.env is missing or has empty values for:${missing}" >&2; exit 1; }
        msg: "deploy/.env is missing one or more required keys (see stderr for names)."
      # compose.yaml interpolates the database passwords into postgres://
      # URLs unescaped, so a character such as '%', '@', '/' or ':' would
      # break the DSN (or change its meaning). Allow only URL-unreserved
      # characters; hex from `openssl rand -hex 24` always qualifies.
      - sh: |
          bad=""
          for k in POSTGRES_PASSWORD APP_USER_PASSWORD GRAPH_USER_PASSWORD; do
            if grep -E "^${k}=" {{.ROOT_DIR}}/deploy/.env | grep -qvE "^${k}=[A-Za-z0-9._~-]+$"; then
              bad="${bad} ${k}"
            fi
          done
          test -z "${bad}" || { echo "deploy/.env has database passwords that are not URL-safe:${bad}" >&2; exit 1; }
        msg: "deploy/.env database passwords may contain only A-Z a-z 0-9 . _ ~ - because compose.yaml embeds them in postgres:// URLs (see stderr for names). Generate each with: openssl rand -hex 24"
    cmds:
      # --force-recreate: podman-compose recreates a container only when its
      # compose config hash changes, not when its image is rebuilt under the
      # same tag, so without it a re-run of deploy:up after an upgrade kept the
      # old crosscodexd running. Volumes persist; services restart briefly.
      - "{{.COMPOSE_CMD}} {{.COMPOSE_FILES}}{{range splitList \" \" .COMPOSE_OVERLAY}}{{if .}} -f {{.}}{{end}}{{end}} up -d --build --force-recreate"
      - |
        echo "Waiting for gateway /healthz ..."
        # 150 x 2s = 300s. Covers the worst-case cold start of the full chain:
        # the LLM gateway (litellm: start_period 15s + 30 x 5s = 165s) then
        # crosscodexd (start_period 20s + 20 x 5s = 100s), with margin.
        for i in $(seq 1 150); do
          if curl -sf --cacert {{.CERTS_DIR}}/ca.pem https://localhost:{{.GATEWAY_PORT}}/healthz >/dev/null; then
            echo "Gateway healthy at https://localhost:{{.GATEWAY_PORT}}"
            echo "Next: crosscodex config set cli.endpoint https://localhost:{{.GATEWAY_PORT}}"
            exit 0
          fi
          sleep 2
        done
        echo "Gateway did not become healthy in time; recent logs:" >&2
        # Include the LLM gateway's services: when it crash-loops, crosscodexd
        # (gated on it being healthy) never starts and logs nothing.
        {{.COMPOSE_CMD}} {{.COMPOSE_FILES}} logs --tail=50 crosscodexd {{if eq .LLM_GATEWAY "praxis"}}praxis{{else}}litellm litellm-tls{{end}} >&2
        exit 1

  down:
    desc: Stop the stack, whichever LLM gateway it runs (pass VOLUMES=1 to also drop data + cert volumes)
    dir: "{{.ROOT_DIR}}/deploy"
    env:
      CROSSCODEX_CERTS_VOLUME: "{{.CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.GATEWAY_PORT}}"
    preconditions:
      - sh: "test -f {{.ROOT_DIR}}/deploy/.env"
        msg: "deploy/.env missing, so compose cannot resolve the stack's required variables to tear it down. Restore deploy/.env (copy deploy/.env.example and fill it in) and rerun."
    cmds:
      # podman-compose prints "no container ... found" for the gateway that
      # isn't running; that is expected and harmless.
      # Load every gateway fragment, not just LLM_GATEWAY's, so compose knows
      # both gateways' services and removes whichever exist; teardown therefore
      # ignores LLM_GATEWAY and PRAXIS_MODELS_ENDPOINT. Not --remove-orphans:
      # the production project is named after the directory ("deploy"), so it
      # would also delete unrelated containers in any project named "deploy",
      # such as the backup sidecars or a stack run from another deploy/ dir.
      - '{{.COMPOSE_CMD}} -f {{.ROOT_DIR}}/deploy/compose.yaml -f {{.ROOT_DIR}}/deploy/compose.gateway-litellm.yaml -f {{.ROOT_DIR}}/deploy/compose.gateway-praxis.yaml -f {{.ROOT_DIR}}/deploy/compose.gateway-praxis-models.yaml{{range splitList " " .COMPOSE_OVERLAY}}{{if .}} -f {{.}}{{end}}{{end}} down {{if eq .VOLUMES "1"}}--volumes{{end}}'
      # compose's own `down --volumes` does NOT remove `external` volumes, so
      # the key volumes must be dropped explicitly: the per-service server
      # volumes, the client volume and the attestation volume, plus the
      # shared <CERTS_VOLUME> volume releases before #298 loaded, which holds
      # the old shared server key (`volume rm -f` ignores one that is absent).
      # This keeps VOLUMES=1 a true full teardown and guarantees the next `up`
      # reloads a freshly generated PKI rather than stale certs (mirrors
      # test:integration's cert teardown).
      # Only names that exist exactly are passed to `volume rm`: podman (6.1)
      # resolves a name with no exact match as a prefix, so the bare
      # <CERTS_VOLUME>, absent on any stack loaded since #298, matched every
      # <CERTS_VOLUME>-<service> and failed "more than one result" even with
      # -f. A listing that fails, or a volume that exists but won't go, fails
      # the task.
      - |
        {{if eq .VOLUMES "1"}}
        existing="$({{.CONTAINER_ENGINE}} volume ls --format '{{`{{.Name}}`}}')" || exit 1
        for v in {{range splitList " " .CERT_SERVICES}}{{$.CERTS_VOLUME}}-{{.}} {{end}}{{.CERTS_VOLUME}} {{.CLIENT_CERTS_VOLUME}} {{.ATTESTATION_KEYS_VOLUME}}; do
          if printf '%s\n' "${existing}" | grep -qxF -- "${v}"; then
            {{.CONTAINER_ENGINE}} volume rm "${v}" || exit 1
          fi
        done
        {{end}}

  logs:
    desc: Tail stack logs
    vars:
      LLM_GATEWAY: "{{.DEPLOY_LLM_GATEWAY}}"
      PRAXIS_MODELS_ENDPOINT: "{{.DEPLOY_PRAXIS_MODELS_ENDPOINT}}"
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm, praxis]
        - name: PRAXIS_MODELS_ENDPOINT
          enum: ["false", "true"]
    dir: "{{.ROOT_DIR}}/deploy"
    cmds:
      - "{{.COMPOSE_CMD}} {{.COMPOSE_FILES}} logs -f {{.CLI_ARGS}}"

  smoke:
    desc: Container-driven smoke test (up, catalog round-trip over mTLS, then teardown regardless of outcome; LOCAL=1 for the fast host-build path)
    vars:
      LLM_GATEWAY: "{{.SMOKE_LLM_GATEWAY}}"
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm, praxis]
    # Checked before cmds, so the smoke:down defer is never registered: a
    # teardown without deploy/.env would fail compose interpolation and bury
    # this message under a podman-compose traceback.
    preconditions:
      - sh: "test -f {{.ROOT_DIR}}/deploy/.env"
        msg: "deploy/.env missing. Copy deploy/.env.example to deploy/.env and fill it in."
    cmds:
      # Deferred so the stack is always torn down, whether smoke:up passes,
      # fails, or is interrupted. Registered before smoke:up runs; deferred cmds
      # execute at task exit in reverse order.
      - defer:
          task: smoke:down
      - task: smoke:up

  smoke:up:
    desc: Bring up the isolated smoke stack and run the catalog round-trip (leaves the stack running for debugging)
    vars:
      LLM_GATEWAY: "{{.SMOKE_LLM_GATEWAY}}"
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm, praxis]
    # Export the smoke isolation identity so the script's child `task deploy:up`
    # and compose.yaml resolve the smoke project, cert volumes, gateway port, and
    # PKI dir (go-task reads env vars as vars; CROSSCODEX_* feed the CERTS_VOLUME
    # / CLIENT_CERTS_VOLUME / ATTESTATION_KEYS_VOLUME / GATEWAY_PORT vars, CERTS_DIR is read directly, COMPOSE_PROJECT_NAME is
    # inherited by the compose subprocess).
    env:
      COMPOSE_PROJECT_NAME: "{{.SMOKE_PROJECT}}"
      CROSSCODEX_CERTS_VOLUME: "{{.SMOKE_CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.SMOKE_CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.SMOKE_ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.SMOKE_GATEWAY_PORT}}"
      CERTS_DIR: "{{.SMOKE_CERTS_DIR}}"
      # Gateway under test; smoke_up.sh exports it to its child deploy:up,
      # where the process env beats deploy/.env. PRAXIS_MODELS_ENDPOINT is
      # pinned the same way (CLI or env, else false) so a value persisted in
      # deploy/.env cannot change the smoke stack either.
      LLM_GATEWAY: "{{.LLM_GATEWAY}}"
      PRAXIS_MODELS_ENDPOINT: '{{.PRAXIS_MODELS_ENDPOINT | default "false"}}'
      SMOKE_PRAXIS_PORT: "{{.SMOKE_PRAXIS_PORT}}"
      # Seconds smoke_up.sh waits for the analysis job (it validates the
      # value). Raise it for CPU-only inference: SMOKE_JOB_TIMEOUT=600.
      SMOKE_JOB_TIMEOUT: '{{.SMOKE_JOB_TIMEOUT | default "120"}}'
      # Offline LLM provider identity. Exported so smoke_up.sh renders the
      # gateway config and (for a remote host) probes/pulls against the same
      # values. Defaults resolve to the local baked-model Ollama container;
      # override with `task deploy:smoke:up OLLAMA_HOST=http://host:11434`.
      OLLAMA_HOST: "{{.OLLAMA_HOST}}"
      OLLAMA_CHAT_MODEL: "{{.OLLAMA_CHAT_MODEL}}"
      OLLAMA_EMBED_MODEL: "{{.OLLAMA_EMBED_MODEL}}"
      # Or any other OpenAI-compatible server (llama.cpp, vLLM, ...):
      # `task deploy:smoke:up OPENAI_COMPAT_HOST=http://localhost:18080`, with
      # OPENAI_COMPAT_CHAT_MODEL / OPENAI_COMPAT_EMBED_MODEL to override the
      # model IDs smoke_up.sh defaults. Empty selects Ollama.
      OPENAI_COMPAT_HOST: '{{.OPENAI_COMPAT_HOST | default ""}}'
      OPENAI_COMPAT_CHAT_MODEL: '{{.OPENAI_COMPAT_CHAT_MODEL | default ""}}'
      OPENAI_COMPAT_EMBED_MODEL: '{{.OPENAI_COMPAT_EMBED_MODEL | default ""}}'
      # Comma-separated list of exactly three model names for the panel-1..3
      # aliases (relationship, requires and critique panels). Empty selects the
      # renderer's default: three distinct models for OPENAI_COMPAT_HOST, the
      # chat model three times for Ollama.
      OPENAI_COMPAT_PANEL_MODELS: '{{.OPENAI_COMPAT_PANEL_MODELS | default ""}}'
      OLLAMA_PANEL_MODELS: '{{.OLLAMA_PANEL_MODELS | default ""}}'
      # smoke_up.sh builds the baked-model Ollama image directly (the equivalent
      # integration task is internal / not CLI-callable); it needs the engine.
      CONTAINER_ENGINE: "{{.CONTAINER_ENGINE}}"
    cmds:
      # Pass LOCAL through the script's environment so its child `task deploy:up`
      # picks it up as a var (go-task reads env vars as vars). smoke_up.sh
      # additionally exports COMPOSE_OVERLAY (the gateway's offline overlay or
      # offline-remote, chosen by LLM_GATEWAY and OLLAMA_HOST) for that child task.
      - LOCAL="{{.LOCAL}}" COMPOSE_CMD="{{.COMPOSE_CMD}}" bash {{.ROOT_DIR}}/test/deploy/smoke_up.sh

  smoke:down:
    desc: Tear down the isolated smoke stack, dropping its data + cert volumes and throwaway PKI (pass the same LLM_GATEWAY as smoke:up)
    vars:
      LLM_GATEWAY: "{{.SMOKE_LLM_GATEWAY}}"
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm, praxis]
    # Same isolation identity as smoke:up so deploy:down and the volume removal
    # act on the smoke stack, not the production one.
    env:
      COMPOSE_PROJECT_NAME: "{{.SMOKE_PROJECT}}"
      CROSSCODEX_CERTS_VOLUME: "{{.SMOKE_CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.SMOKE_CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.SMOKE_ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.SMOKE_GATEWAY_PORT}}"
      CERTS_DIR: "{{.SMOKE_CERTS_DIR}}"
      # Load the gateway's offline overlay so `deploy:down` also removes the
      # ollama service the smoke stack added; the base files alone do not know it.
      COMPOSE_OVERLAY: '{{.ROOT_DIR}}/deploy/{{if eq .LLM_GATEWAY "praxis"}}compose.offline-praxis.yaml{{else}}compose.offline.yaml{{end}}'
      SMOKE_PRAXIS_PORT: "{{.SMOKE_PRAXIS_PORT}}"
    cmds:
      # Source the same podman env smoke_up.sh uses (TMPDIR/STORAGE_DRIVER in a
      # container) so teardown acts on the runtime view that created the stack.
      # The smoke test never loads compose.backup.yaml, but a maintainer who
      # layers it on the smoke stack by hand leaves its backup
      # volume, which deploy:down does not know; `volume rm -f` ignores a
      # missing volume.
      - export ROOT_DIR="{{.ROOT_DIR}}" && . {{.ROOT_DIR}}/test/deploy/podman_env.sh && task deploy:down VOLUMES=1 && {{.CONTAINER_ENGINE}} volume rm -f {{.SMOKE_PROJECT}}_crosscodex-backup
      - rm -rf {{.SMOKE_CERTS_DIR}}

  local:
    desc: Bring up a persistent, offline stack to try CrossCodex under its own identity (project crosscodex-local, port 50251, PKI in .local/crosscodex/pki), then build the CLI and print how to connect (LOCAL=1 for the fast host-build path; INGESTION=1 adds document ingestion, INGESTION=rustfs also moves object storage to RustFS)
    vars:
      LLM_GATEWAY: "{{.LOCAL_LLM_GATEWAY}}"
      INGESTION: "{{.LOCAL_INGESTION}}"
    requires:
      vars:
        - name: LLM_GATEWAY
          enum: [litellm]
        - name: INGESTION
          enum: ["0", "1", rustfs]
    # Checked before cmds, so nothing is built or started without deploy/.env;
    # same message as deploy:up, which local_up.sh's child would otherwise
    # reach only after the provider checks and image builds.
    preconditions:
      - sh: "test -f {{.ROOT_DIR}}/deploy/.env"
        msg: "deploy/.env missing. Copy deploy/.env.example to deploy/.env and fill it in."
    # The local identity, exported to local_up.sh, its child `task deploy:up`
    # and compose.yaml exactly as smoke:up exports the smoke identity. OUT_DIR
    # is where local_up.sh renders the gateway config the offline overlay mounts.
    env:
      COMPOSE_PROJECT_NAME: "{{.LOCAL_PROJECT}}"
      CROSSCODEX_CERTS_VOLUME: "{{.LOCAL_CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.LOCAL_CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.LOCAL_ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.LOCAL_GATEWAY_PORT}}"
      CERTS_DIR: "{{.LOCAL_CERTS_DIR}}"
      OUT_DIR: "{{.LOCAL_DIR}}"
      ROOT_DIR: "{{.ROOT_DIR}}"
      LLM_GATEWAY: "{{.LLM_GATEWAY}}"
      PRAXIS_MODELS_ENDPOINT: "false"
      # Overlays local_up.sh appends to its offline overlay (empty unless
      # INGESTION is 1 or rustfs).
      INGESTION_OVERLAYS: "{{.LOCAL_INGESTION_OVERLAYS}}"
      # Offline LLM provider knobs, as for smoke:up: the baked-model Ollama
      # container by default, OLLAMA_HOST for an existing Ollama, or
      # OPENAI_COMPAT_HOST for another OpenAI-compatible server.
      OLLAMA_HOST: "{{.OLLAMA_HOST}}"
      OLLAMA_CHAT_MODEL: "{{.OLLAMA_CHAT_MODEL}}"
      OLLAMA_EMBED_MODEL: "{{.OLLAMA_EMBED_MODEL}}"
      OPENAI_COMPAT_HOST: '{{.OPENAI_COMPAT_HOST | default ""}}'
      OPENAI_COMPAT_CHAT_MODEL: '{{.OPENAI_COMPAT_CHAT_MODEL | default ""}}'
      OPENAI_COMPAT_EMBED_MODEL: '{{.OPENAI_COMPAT_EMBED_MODEL | default ""}}'
      OPENAI_COMPAT_PANEL_MODELS: '{{.OPENAI_COMPAT_PANEL_MODELS | default ""}}'
      OLLAMA_PANEL_MODELS: '{{.OLLAMA_PANEL_MODELS | default ""}}'
      CONTAINER_ENGINE: "{{.CONTAINER_ENGINE}}"
    cmds:
      - LOCAL="{{.LOCAL}}" COMPOSE_CMD="{{.COMPOSE_CMD}}" bash {{.ROOT_DIR}}/deploy/local_up.sh
      # The host CLI dials the published gateway port over mTLS. Generated API
      # code is gitignored, so a fresh clone needs it before the build.
      # CGO_ENABLED=0 mirrors the release binary, as smoke_up.sh does.
      - task: :dev:generate
      - CGO_ENABLED=0 go build -o {{.LOCAL_DIR}}/bin/crosscodex {{.ROOT_DIR}}/cmd/crosscodex
      - |
        echo
        echo "CrossCodex is running offline at https://localhost:{{.LOCAL_GATEWAY_PORT}} (compose project {{.LOCAL_PROJECT}})."
        echo "Run the CLI with the stack's client certificate, for example:"
        echo
        echo "  {{.LOCAL_DIR}}/bin/crosscodex --endpoint https://localhost:{{.LOCAL_GATEWAY_PORT}} --tls-ca {{.LOCAL_CERTS_DIR}}/ca.pem --tls-cert {{.LOCAL_CERTS_DIR}}/client.pem --tls-key {{.LOCAL_CERTS_DIR}}/client-key.pem catalog list"
        echo
        echo "Stop it with 'task deploy:local:down'; its data is kept for the next 'task deploy:local'."

  local:down:
    desc: >-
      Stop the deploy:local stack, keeping its data volumes and PKI. Pass VOLUMES=1 to drop them: it runs
      deploy:down VOLUMES=1 on the local stack, then removes .local/crosscodex (the PKI and its CA key) only if that succeeded.
      It always removes the ingestion service; pass INGESTION=rustfs, as for deploy:local, to remove the RustFS services and volume too.
    vars:
      INGESTION: "{{.LOCAL_INGESTION}}"
    requires:
      vars:
        - name: INGESTION
          enum: ["0", "1", rustfs]
    # Same identity as local, so deploy:down acts on the local stack. The
    # offline overlay lets compose also remove the ollama service it added,
    # and the ingestion overlays the services they add (below);
    # CROSSCODEX_GATEWAY_CONFIG_DIR keeps its mount on the local dir.
    env:
      COMPOSE_PROJECT_NAME: "{{.LOCAL_PROJECT}}"
      CROSSCODEX_CERTS_VOLUME: "{{.LOCAL_CERTS_VOLUME}}"
      CROSSCODEX_CLIENT_CERTS_VOLUME: "{{.LOCAL_CLIENT_CERTS_VOLUME}}"
      CROSSCODEX_ATTESTATION_KEYS_VOLUME: "{{.LOCAL_ATTESTATION_KEYS_VOLUME}}"
      CROSSCODEX_GATEWAY_PORT: "{{.LOCAL_GATEWAY_PORT}}"
      # compose.ingestion.yaml is loaded whatever INGESTION is, as deploy:down
      # loads every gateway fragment, so an ingestion container is removed
      # even when INGESTION is not repeated here; it needs no secrets.
      # compose.rustfs.yaml only with INGESTION=rustfs: it refuses to parse
      # without the RustFS keys.
      COMPOSE_OVERLAY: '{{.ROOT_DIR}}/deploy/compose.offline.yaml {{.ROOT_DIR}}/deploy/compose.ingestion.yaml{{if eq .INGESTION "rustfs"}} {{.ROOT_DIR}}/deploy/compose.rustfs.yaml{{end}}'
      CROSSCODEX_GATEWAY_CONFIG_DIR: "{{.LOCAL_DIR}}"
    cmds:
      # Same podman runtime view as local_up.sh (TMPDIR/STORAGE_DRIVER in a
      # container). Without VOLUMES=1 the data and key volumes survive. With it,
      # the PKI is removed only after the volumes were, so a failed teardown
      # keeps the CA key that matches the volumes still there.
      - export ROOT_DIR="{{.ROOT_DIR}}" && . {{.ROOT_DIR}}/test/deploy/podman_env.sh && task deploy:down{{if eq .VOLUMES "1"}} VOLUMES=1 && rm -rf "{{.LOCAL_DIR}}"{{end}}
